<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfection</title>

    <!-- Ekstern CSS for global stil og ikoner -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">

    <!-- Robots: Tillat søkemotorer å indeksere -->
    <meta name="robots" content="index, follow">

    <!-- Ikoner for ulike enheter -->
    <link rel="icon" type="image/png" sizes="32x32" href="Bilder/ikoner/logo_webb.png">
    <link rel="icon" type="image/png" sizes="192x192" href="Bilder/ikoner/logo_webb.png">
    <link rel="apple-touch-icon" sizes="180x180" href="Bilder/ikoner/logo_webb.png">

    <!-- PWA / mobil optimalisering -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="white">

    <!-- Google Search Console -->
    
    
    <!-- Tittel og beskrivelse (SEO) -->
    <title>Perfection</title>
    <meta name="description" content="Perfection er en app som hjelper deg å bli bedre hver dag. Med enkle verktøy for å sette mål, spore fremgang og få innsikt i dine vaner, gjør Perfection det lettere enn noen gang å nå dine mål og forbedre deg selv.">

</head>
<body>
    <style>
        .diagram_grid{
            display: flex;
            flex-direction: column;
            width:calc(100vw - 20px);
            margin-top: 15px;
            margin-bottom: 15px;
            background-color: white;
            border-radius: 16px;
            padding:12px;
            gap:5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin:10px;
        }

        .chart_area{
            position:relative;
            width:100%;
            min-height: 170px;
            height: 170px;
            background: white;
            border-radius: 16px;

            display:flex;
            justify-content: space-evenly;
            position: relative;
            align-items: flex-end;
        }

         .diagram-header{
            display:flex;
            flex-direction: column;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            width:100%;
        }

        .diagram-title{
            display:flex;
            align-items:center;
            gap:8px;
            min-width:0;
        }

        .diagram-title-icon{
            width:28px;
            height:28px;
            border-radius:50%;
            background:#e6f9ef;
            color:var(--primary-color);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:.85rem;
            flex-shrink:0;
        }

        .diagram-title p{
            color:var(--text-color);
            font-size:.9rem;
            font-weight:700;
            margin:0;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .grid{
            position:absolute;
            inset:0;
            display:flex;
            flex-direction:column;
            justify-content:space-between;
        }

        .grid div{
            border-top:1px dashed #e5e5e5;
        }

        .bar-group{
            height: 100%;
            display:flex;
            flex-direction:column;
            justify-content:flex-end;
        }

        .bar{
            width:100%;
            height: 0%;
            background-color: var(--primary-color);
            border-radius: 8px 8px 0px 0px;
        }

        .value{
            font-size:13px;
            text-align: center;
            min-width:15px;
        }

        .chart_legend{
            display:flex;
            
            gap:8px;
            margin-top:4px;
        }

        .chart_legend_item{
            min-width:0;
            padding:10px;
            border:1px solid #eef1f0;
            border-radius:10px;
            background:#f9fbfa;
            display:flex;
            align-items:center;
            gap:9px;
            width:100%;
        }

        .chart_legend_text{
            min-width:0;
        }

        .chart_legend_label{
            color:#737b82;
            font-size:.7rem;
            font-weight:700;
            margin:0 0 3px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .chart_legend_value{
            color:var(--text-color);
            font-size:.9rem;
            font-weight:600;
            margin:0;
            line-height:1.1;
        }

        .diagram-actions{
            display:flex;
            gap:8px;
            width:100%;
            max-width:100%;
            min-width:0;
            overflow-x:auto;
            padding:2px 0 8px;
            scrollbar-width:none;
            scrollbar-color:#bfc8c4 transparent;
        }

        .diagram-actions::-webkit-scrollbar{
            height:6px;
        }

        .diagram-actions::-webkit-scrollbar-track{
            background:transparent;
        }

        .diagram-actions::-webkit-scrollbar-thumb{
            background:#bfc8c4;
            border-radius:999px;
        }

        .diagram-action{
            min-width:max-content;
            height:34px;
            border:1px solid #e3e7eb;
            border-radius:10px;
            background:#f8faf9;
            color:#59616a;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:7px;
            padding:0 12px;
            font-size:.78rem;
            font-weight:700;
            font-family:inherit;
            cursor:pointer;
            box-shadow:0 2px 7px rgba(0,0,0,0.04);
            transition:background-color .18s ease, border-color .18s ease, color .18s ease, transform .18s ease;
            width:100%;
        }

        .diagram-action i{
            font-size:.82rem;
        }

        .diagram-action:hover{
            background:#eefbf5;
            border-color:#b8ead4;
            color:var(--primary-color);
        }

        .diagram-action:active{
            transform:translateY(1px);
        }

        .diagram-action.active,
        .diagram-action[aria-pressed="true"]{
            background:var(--primary-color);
            border-color:var(--primary-color);
            color:white;
        }

        .open_stats{
            width:calc(100vw - 20px);
            margin:10px;
            padding:14px;
            background:var(--white);
            border-radius:16px;
            box-shadow:0 4px 10px rgba(0,0,0,0.05);
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:14px;
        }

        .open_stats__content{
            display:flex;
            align-items:center;
            gap:10px;
            min-width:0;
        }

        .open_stats__icon{
            width:34px;
            height:34px;
            border-radius:50%;
            background:#e6f9ef;
            color:var(--primary-color);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:.95rem;
            flex-shrink:0;
        }

        .open_stats__text{
            min-width:0;
        }

        .open_stats__title{
            color:var(--text-color);
            font-size:.9rem;
            font-weight:700;
            margin:0;
        }

        .open_stats__description{
            color:var(--subtext-color);
            font-size:.72rem;
            line-height:1.35;
            margin:3px 0 0 0;
        }

        .open_stats__button{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:6px;
            min-height:34px;
            padding:0 12px;
            border-radius:999px;
            background:var(--primary-color);
            color:white;
            font-size:.78rem;
            font-weight:700;
            text-decoration:none;
            flex-shrink:0;
            box-shadow:0 4px 10px rgba(0,176,121,0.18);
        }

        .open_stats__button:active{
            transform:scale(.98);
        }

        @media (min-width: 560px){
            .diagram-header{
                flex-direction:row;
                align-items:center;
            }

            .diagram-actions{
                flex:1;
                max-width:65%;
                justify-content:flex-end;
            }
        }

        @media (max-width: 430px){
            .chart_legend{
                grid-template-columns:1fr;
            }
        }
    </style>

    <main>
        <section class="diagram_grid">
            <div class="diagram-header">
                <div class="diagram-title">
                    <div class="diagram-title-icon"><i class="fa-solid fa-chart-column"></i></div>
                    <p>Ukentlig distanse</p>
                </div>
               <div class="diagram-actions" aria-label="Velg aktivitet for diagram">
                    <button value="Løping" class="diagram-action active" type="button" aria-pressed="true">
                        <i class="fa-solid fa-person-running" aria-hidden="true"></i>
                        <span>Løping</span>
                    </button>
                    <button value="Sykling" class="diagram-action" type="button" aria-pressed="false">
                        <i class="fa-solid fa-bicycle" aria-hidden="true"></i>
                        <span>Sykling</span>
                    </button>
                    <button value="Svømming" class="diagram-action" type="button" aria-pressed="false">
                        <i class="fa-solid fa-person-swimming" aria-hidden="true"></i>
                        <span>Svømming</span>
                    </button>
                    <button value="Gåtur" class="diagram-action" type="button" aria-pressed="false">
                        <i class="fa-solid fa-person-walking" aria-hidden="true"></i>
                        <span>Gåtur</span>
                    </button>
               </div>
            </div>

        <div class="chart_area">
            <div class="grid">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>


            <div class="bar-group">
                <div class="value" id="km_per_uke_12">0</div>
                <div class="bar" id="progress_fill_12"></div>
            </div>

            <div class="bar-group">
                <div class="value" id="km_per_uke_11">0</div>
                <div class="bar" id="progress_fill_11"></div>
            </div>

            <div class="bar-group">
                <div class="value" id="km_per_uke_10">0</div>
                <div class="bar" id="progress_fill_10"></div>
            </div>

            <div class="bar-group">
                <div class="value" id="km_per_uke_9">0</div>
                <div class="bar" id="progress_fill_9"></div>
            </div>

            <div class="bar-group">
                <div class="value" id="km_per_uke_8">0</div>
                <div class="bar" id="progress_fill_8"></div>
            </div>

            <div class="bar-group">
                <div class="value" id="km_per_uke_7">0</div>
                <div class="bar" id="progress_fill_7"></div>
            </div>

             <div class="bar-group">
                <div class="value" id="km_per_uke_6">0</div>
                <div class="bar" id="progress_fill_6"></div>
            </div>

             <div class="bar-group">
                <div class="value" id="km_per_uke_5">0</div>
                <div class="bar" id="progress_fill_5"></div>
            </div>

             <div class="bar-group">
                <div class="value" id="km_per_uke_4">0</div>
                <div class="bar" id="progress_fill_4"></div>
            </div>

             <div class="bar-group">
                <div class="value" id="km_per_uke_3">0</div>
                <div class="bar" id="progress_fill_3"></div>
            </div>

             <div class="bar-group">
                <div class="value" id="km_per_uke_2">0</div>
                <div class="bar" id="progress_fill_2"></div>
            </div>

             <div class="bar-group">
                <div class="value" id="km_per_uke_1">0</div>
                <div class="bar" id="progress_fill_1"></div>
            </div>
        </div>

        <div class="chart_legend" aria-label="Distanseoversikt">
            <article class="chart_legend_item">
                <div class="chart_legend_text">
                    <p class="chart_legend_label">Totalt</p>
                    <p id="total_distanse" class="chart_legend_value">0 km</p>
                </div>
            </article>

            <article class="chart_legend_item">
                <div class="chart_legend_text">
                    <p class="chart_legend_label">I år</p>
                    <p id="års_distanse" class="chart_legend_value">0 km</p>
                </div>
            </article>

            <article class="chart_legend_item">
                <div class="chart_legend_text">
                    <p class="chart_legend_label">Denne måneden</p>
                    <p id="måneds_distanse" class="chart_legend_value">0 km</p>
                </div>
            </article>
        </div>
        </section>

        <section class="open_stats">
            <div class="open_stats__content">
                <div class="open_stats__icon"><i class="fa-solid fa-arrow-up-right-dots" aria-hidden="true"></i></div>
                <div class="open_stats__text">
                    <p class="open_stats__title">Statistikk</p>
                    <p class="open_stats__description">Se din trenings-statistikk</p>
                </div>
            </div>

            <a class="open_stats__button" href="#" aria-label="Åpne trenings-statistikk">
                <span>Åpne</span>
                <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
            </a>
        </section>
    </main>
    
    <script src="navigator.js" defer></script>
    <script type="module" src="../progress.js"></script>
    <script type="module" src="statistikk.js"></script>
</body>
</html>
