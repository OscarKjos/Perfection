<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <link rel="manifest" href="manifest.json">

    <!-- Robots: Tillat søkemotorer å indeksere -->
    <meta name="robots" content="index, follow">

    <!-- Ikoner for ulike enheter -->
    <link rel="icon" type="image/png" sizes="32x32" href="Bilder/ikoner/logo_webb.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="Bilder/ikoner/logo_webb.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="Bilder/ikoner/logo_light.png"> 

    <!-- PWA / mobil optimalisering -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="white">

    <title>Treningsprogram og øvelser</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #f5f7f9;
            color: #24272b;
            font-family: Arial, sans-serif;
        }

        .stretch-page {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 24px 18px 32px;
            background: #ffffff;
        }

        .page-header {
            display:flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .page-label {
            display: block;
            color: #8a9199;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .page-title {
            color: #292c30;
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.15;
        }

        .exercise-card {
            overflow: hidden;
            border: 1px solid #e5e8eb;
            border-radius: 22px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(28, 35, 43, 0.08);
        }

        .exercise-image-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            padding: 10px;
            background: #fafafa;
        }

        .exercise-image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .exercise-content {
            padding: 20px;
        }

        .exercise-number {
            margin-bottom: 8px;
            color: #8b929a;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .exercise-title {
            color: #26292d;
            font-size: 1.3rem;
            font-weight: 800;
            line-height: 1.25;
        }

        .exercise-target {
            margin-top: 8px;
            color: #6c737b;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .navigation {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .navigation-button {
            min-height: 52px;
            border: 1px solid #dfe3e7;
            border-radius: 15px;
            background: #ffffff;
            color: #33373c;
            font: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
        }

        .navigation-button i {
            font-size: 1rem;
        }

        .navigation-button.previous i {
            margin-right: 8px;
        }

        .navigation-button.next {
            background: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }

        .navigation-button.next i {
            margin-left: 8px;
        }

        .stretch-info {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            width: 100%;
            margin-top:10px;
        }

        .stretch-info__card {
            min-width: 0;
            padding: 18px 8px 16px;
            border: 1px solid rgba(38, 145, 149, 0.05);
            border-radius: 12px;
            background:
                linear-gradient(
                    145deg,
                    #f8fcfc 0%,
                    #f2f8f8 100%
                );

            text-align: center;
        }

        .stretch-info__icon {
            display: block;
            margin-bottom: 14px;
            color: var(--primary-color);
            font-size: 1.7rem;
        }

        .stretch-info__label {
            margin: 0 0 6px;
            overflow: hidden;
            color: #6f8588;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            line-height: 1.2;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .stretch-info__value {
            margin: 0;
            color: #17263b;
            font-size: 0.82rem;
            font-weight: 700;
            line-height: 1.25;
        }

        @media (max-width: 380px) {
            .stretch-page {
                padding-inline: 14px;
            }

            .page-title {
                font-size: 1.55rem;
            }

            .navigation-button span {
                display: none;
            }

            .navigation-button i {
                margin: 0 !important;
            }
        }
    </style>
</head>

<body>
    <main class="stretch-page">

        <header class="page-header">
            <a href="index.html" class="no_link"><span class="brand"><img style="width:30px;" src="Bilder/ikoner/logo_light.png" alt="Logo"> KVADOR</span></a>
            <span id="change_top_text" class="page-label">Uttøyingsøvelser</span>
        </header>

        <article class="exercise-card">

            <div class="exercise-image-wrapper">
                <img
                    class="exercise-image"
                    src="../Bilder/stretching/calf.png"
                    alt="Illustrasjon av uttøying av leggmuskulaturen mot en vegg"
                >
            </div>

            <div class="exercise-content">
                <p class="exercise-number">Øvelse 1 av 8</p>

                <h2 class="exercise-title">
                    Stående leggstrekk
                </h2>

                <p class="exercise-target">
                    Uttøying av leggmuskulaturen med bakre hæl i gulvet.
                </p>

                <section class="stretch-info" aria-label="Informasjon om øvelsen">
                    <article class="stretch-info__card">
                        <i class="fa-solid fa-crosshairs stretch-info__icon"></i>

                        <p class="stretch-info__label">
                            Muskel
                        </p>

                        <p id="active_muscle" class="stretch-info__value">
                            Leggmuskel
                        </p>
                    </article>

                    <article class="stretch-info__card">
                        <i class="fa-regular fa-clock stretch-info__icon"></i>

                        <p class="stretch-info__label">
                            Hold tid
                        </p>

                        <p class="stretch-info__value">
                            20–30 sek
                        </p>
                    </article>

                    <article class="stretch-info__card">
                        <i class="fa-solid fa-rotate-right stretch-info__icon"></i>

                        <p class="stretch-info__label">
                            Gjenta
                        </p>

                        <p class="stretch-info__value">
                            2–3 ganger
                        </p>
                    </article>
                </section>
            </div>

        </article>

        <nav class="navigation" aria-label="Navigasjon mellom øvelser">

            <button id="previous_exercise" class="navigation-button previous" type="button">
                <i class="fa-solid fa-chevron-left"></i>
                <span>Forrige</span>
            </button>

            <button id="next_exercise" class="navigation-button next" type="button">
                <span>Neste</span>
                <i class="fa-solid fa-chevron-right"></i>
            </button>

        </nav>

    </main>
    
    <script>
        const stretches = [
            // 1. STÅENDE – legg og bakside
            {
                tittel: "Stående leggstrekk",
                beskrivelse: "Uttøying av leggmuskulaturen med bakre hæl i gulvet.",
                muskel: "Leggmuskel",
                bilde: "../Bilder/stretching/calf.png"
            },
            {
                tittel: "Akillessenestrekk mot vegg",
                beskrivelse: "Uttøyer akillessenen og den dype leggmuskulaturen ved å presse kneet fremover med tærne plassert mot veggen.",
                muskel: "Leggmuskler",
                bilde: "../Bilder/stretching/achilles.png"
            },
            {
                tittel: "Stående soleus-strekk",
                beskrivelse: "Uttøyer den dype leggmuskulaturen og akillessenen.",
                muskel: "Soleus",
                bilde: "../Bilder/stretching/øvelse2.png"
            },
            {
                tittel: "Stående quadriceps-strekk",
                beskrivelse: "Uttøyer fremsiden av låret ved å trekke hælen rolig mot setet samtidig som knærne holdes samlet.",
                muskel: "Fremside lår",
                bilde: "../Bilder/stretching/quadriceps.png"
            },
            {
                tittel: "Hamstringstrekk på benk",
                beskrivelse: "Hold benet strakt på en benk og len overkroppen rolig frem til du kjenner et strekk i baksiden av låret.",
                muskel: "Hamstring",
                bilde: "../Bilder/stretching/hamstring.png"
            },
            {
                tittel: "Vidvinklet foroverbøyning",
                beskrivelse: "Stå med føttene langt fra hverandre og bøy deg fremover fra hoftene.",
                muskel: "Bakside lår",
                bilde: "../Bilder/stretching/forover.png"
            },

            // 2. UTFALL OG KNESTÅENDE – hofte og lår
            {
                tittel: "Sidelunge strekk",
                beskrivelse: "Ta et langt steg til siden og senk hoften mot det bøyde beinet.",
                muskel: "Innside lår",
                bilde: "../Bilder/stretching/sidelunge.png"
            },
            {
                tittel: "Verdens beste",
                beskrivelse: "Mobilitetsøvelse for hofter, bein og brystrygg.",
                muskel: "Hofte, bryst",
                bilde: "../Bilder/stretching/øvelse.png"
            },
            {
                tittel: "Knestående hoftebøyerstrekk",
                beskrivelse: "Uttøyer hoftebøyerne og fremsiden av hoften ved å skyve hoften rolig fremover i en utfallsstilling.",
                muskel: "Hoftebøyere",
                bilde: "../Bilder/stretching/hip_flexor.png"
            },
            {
                tittel: "Knelende hamstringstrekk",
                beskrivelse: "Hold det fremre benet strakt og len overkroppen rolig frem mot foten til du kjenner et strekk på baksiden av låret.",
                muskel: "Hamstring",
                bilde: "../Bilder/stretching/knel.png"
            },

            // 3. SITTENDE – bakside, innside og sete
            {
                tittel: "Sittende hekkestilling",
                beskrivelse: "Hold ett ben strakt og len overkroppen rolig frem mot foten til du kjenner et strekk på baksiden av låret.",
                muskel: "Bakside lår",
                bilde: "../Bilder/stretching/hekk.png"
            },
            {
                tittel: "Sittende hamstringstrekk",
                beskrivelse: "Sitt med strake ben og len overkroppen rolig frem mot føttene til du kjenner et strekk på baksiden av lårene.",
                muskel: "Hamstring",
                bilde: "../Bilder/stretching/s_hamstring.png"
            },
            {
                tittel: "Sommerfuglstrekk",
                beskrivelse: "Sitt med fotsålene samlet og len overkroppen rolig frem til du kjenner et strekk på innsiden av lårene.",
                muskel: "Innside lår",
                bilde: "../Bilder/stretching/sommerfugl.png"
            },
            {
                tittel: "Sittende setestrekk",
                beskrivelse: "Uttøyer setemuskulaturen og utsiden av hoften ved å trekke det ene kneet mot motsatt skulder.",
                muskel: "Setemuskler",
                bilde: "../Bilder/stretching/glute.png"
            },

            // 4. PÅ GULVET – sete, hofte og rygg
            {
                tittel: "Kneløft mot bryst (liggende)",
                beskrivelse: "Trekk ett kne rolig opp mot brystet mens det andre benet holdes strakt mot underlaget.",
                muskel: "Setemuskulatur",
                bilde: "../Bilder/stretching/kneløft.png"
            },
            {
                tittel: "Kobra strekk",
                beskrivelse: "Uttøyer mage, bryst og hoftebøyere samtidig som ryggen mobiliseres.",
                muskel: "Mage, rygg",
                bilde: "../Bilder/stretching/kobra.png"
            },
            {
                tittel: "Barnets posisjon",
                beskrivelse: "Sett deg tilbake på hælene og strekk armene rolig fremover til du kjenner et strekk i ryggen.",
                muskel: "Øvre rygg",
                bilde: "../Bilder/stretching/munk.png"
            },
            {
                tittel: "Ryggstrekk",
                beskrivelse: "Bøy deg frem med strake armer og senk brystet ned til du kjenner et strekk i øvre del av ryggen og skuldrene.",
                muskel: "Øvre rygg",
                bilde: "../Bilder/stretching/ryggstrekk.png"
            },

            // 5. AVSLUTNING – overkropp og nakke
            {
                tittel: "Stående tricepsstrekk",
                beskrivelse: "Bøy armen bak hodet og trekk albuen forsiktig ned til du kjenner strekk på baksiden av overarmen.",
                muskel: "Triceps",
                bilde: "../Bilder/stretching/triceps.png"
            },
            {
                tittel: "Nakkestrekk",
                beskrivelse: "Bøy hodet rolig til siden og bruk hånden til å øke strekket forsiktig uten å løfte skulderen.",
                muskel: "Nakke",
                bilde: "../Bilder/stretching/neck.png"
            },
            {
                tittel: "Bryststrekk mot vegg",
                beskrivelse: "Stå ved siden av en vegg, plasser hånden mot veggen og roter overkroppen rolig bort til du kjenner strekk i brystet og fremsiden av skulderen.",
                muskel: "Bryst",
                bilde: "../Bilder/stretching/bryst.png"
            },
            {
                tittel: "Håndleddsstrekk",
                beskrivelse: "Hold armen strakt frem og trekk fingrene forsiktig bakover med den andre hånden til du kjenner strekk i håndledd og underarm.",
                muskel: "Håndledd",
                bilde: "../Bilder/stretching/håndledd.png"
            }
        ];

        const mobility = [
            {
                tittel: "Beinvending",
                beskrivelse: "Dynamisk mobilitetsøvelse for hofter og bein med kontrollerte bevegelser.",
                muskel: "Hofte og lår",
                bilde: "../Bilder/mobilitet/beinvend.png"
            },
            {
                tittel: "Dynamisk mobilitet 1",
                beskrivelse: "Dynamisk øvelse som forbereder ledd og muskulatur på aktivitet.",
                muskel: "Bein og hofte",
                bilde: "../Bilder/mobilitet/dynamic1.png"
            },
            {
                tittel: "Dynamisk mobilitet 2",
                beskrivelse: "Kontrollert dynamisk bevegelse for å øke bevegeligheten før trening.",
                muskel: "Bein og hofte",
                bilde: "../Bilder/mobilitet/dynamic2.png"
            },
            {
                tittel: "Dynamisk mobilitet 3",
                beskrivelse: "Mobilitetsøvelse med fokus på aktivt bevegelsesutslag.",
                muskel: "Hofte og bein",
                bilde: "../Bilder/mobilitet/dynamic3.png"
            },
            {
                tittel: "Dynamisk mobilitet 4",
                beskrivelse: "Dynamisk bevegelse som aktiverer muskulaturen og øker bevegeligheten.",
                muskel: "Bein og hofte",
                bilde: "../Bilder/mobilitet/dynamic4.png"
            },
            {
                tittel: "Dynamisk mobilitet 5",
                beskrivelse: "Aktiv mobilitetsøvelse for å forberede kroppen på løping og annen trening.",
                muskel: "Hofte og lår",
                bilde: "../Bilder/mobilitet/dynamic5.png"
            },
            {
                tittel: "Dynamisk mobilitet 6",
                beskrivelse: "Kontrollert mobilitetsøvelse som utfordrer kroppens aktive bevegelsesutslag.",
                muskel: "Hofte og bein",
                bilde: "../Bilder/mobilitet/dynamic6.png"
            },
            {
                tittel: "Dynamisk mobilitet 7",
                beskrivelse: "Dynamisk øvelse for bevegelighet, koordinasjon og aktivering.",
                muskel: "Bein og hofte",
                bilde: "../Bilder/mobilitet/dynamic7.png"
            },
            {
                tittel: "Foam rolling",
                beskrivelse: "Bruk en foam roller til å massere muskulaturen med rolige og kontrollerte bevegelser.",
                muskel: "Muskulatur",
                bilde: "../Bilder/mobilitet/foam_roll.png"
            },
            {
                tittel: "Korsrygg og mage",
                beskrivelse: "Mobilitetsøvelse med fokus på bevegelse i korsrygg og kroppens fremside.",
                muskel: "Korsrygg og mage",
                bilde: "../Bilder/mobilitet/korsrygg_mage.png"
            },
            {
                tittel: "Korsrygg og rygg",
                beskrivelse: "Mobilitetsøvelse som beveger og mobiliserer korsryggen og resten av ryggen.",
                muskel: "Korsrygg og rygg",
                bilde: "../Bilder/mobilitet/korsrygg_rygg.png"
            }
        ];


        const drill = [
            {
                tittel: "A-skipp",
                beskrivelse: "Rytmisk løpsdrill med aktivt kneløft og rask fotsetting under kroppen.",
                muskel: "Hoftebøyere og legger",
                bilde: "../Bilder/drill/A_skipp.png"
            },
            {
                tittel: "B-skipp",
                beskrivelse: "Løpsdrill der kneet løftes før beinet strekkes frem og trekkes aktivt ned mot bakken.",
                muskel: "Hamstring og hoftebøyere",
                bilde: "../Bilder/drill/B_skipp.png"
            },
            {
                tittel: "Høye kneløft",
                beskrivelse: "Raske og rytmiske kneløft med aktiv fotsetting og god kroppsholdning.",
                muskel: "Hoftebøyere og legger",
                bilde: "../Bilder/drill/høyekneløft.png"
            },
            {
                tittel: "Opptrekk / spark bak",
                beskrivelse: "Løpsdrill der hælen trekkes raskt opp mot setet for å trene et effektivt opptrekk.",
                muskel: "Hamstring",
                bilde: "../Bilder/drill/opptrekk.png"
            },
            {
                tittel: "Sprunglauf",
                beskrivelse: "Overdrevne løpssteg med kraftig fraskyv, aktiv hofte og tydelig svevfase.",
                muskel: "Sete, lår og legger",
                bilde: "../Bilder/drill/sprunglauf.png"
            },
            {
                tittel: "Triplings / vristjogg",
                beskrivelse: "Små raske steg med hovedsakelig bevegelse i anklene og kort kontakttid mot bakken.",
                muskel: "Legger og ankler",
                bilde: "../Bilder/drill/tripplings.png"
            }
        ];

        
        let øvelse_nr = 0;

        const next = document.getElementById("next_exercise");
        const previous = document.getElementById("previous_exercise");

        const title = document.querySelector(".exercise-title");
        const number = document.querySelector(".exercise-number");
        const target = document.querySelector(".exercise-target");
        const image = document.querySelector(".exercise-image");
        const muskel = document.getElementById("active_muscle");


        let sektor = "";
        const change_top_text = document.getElementById("change_top_text");

        if (window.location.href.includes("stretching")) {
            sektor = stretches;
            change_top_text.textContent = "Uttøyingsøvelser";
        } else if (window.location.href.includes("mobility")) {
            sektor = mobility;
            change_top_text.textContent = "Mobilitet";
        } else if (window.location.href.includes("drill")) {
            sektor = drill;
            change_top_text.textContent = "Drill-Øvelser";
        }


        function visØvelse(øvelser) {
        const øvelse = øvelser[øvelse_nr];

        title.textContent = øvelse.tittel;
        target.textContent = øvelse.beskrivelse;
        image.src = øvelse.bilde;
        image.alt = øvelse.tittel;
        muskel.textContent = øvelse.muskel;

        number.textContent =
            `Øvelse ${øvelse_nr + 1} av ${øvelser.length}`;
        }

        next.addEventListener("click", () => {
        øvelse_nr++;

        if (øvelse_nr >= sektor.length) {
            øvelse_nr = sektor.length - 1;
        }

        visØvelse(sektor);
        });

        previous.addEventListener("click", () => {
        øvelse_nr--;

        if (øvelse_nr < 0) {
            øvelse_nr = 0;
        }

        visØvelse(sektor);
        });

        visØvelse(sektor);
    </script>
    <script src="global.js"></script>
</body>
</html>
