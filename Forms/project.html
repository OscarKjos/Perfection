<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../global.css">

    <title>Registrer Arbeidstimer</title>

    <style>
        :root{
            --border: #e0e0e0;
            --text: #333;
            --muted: #777;
        }

        body{
            font-family: var(--font);
            margin:0;
            background-color: var(--white);
        }

        .hero {
            position: relative;
            overflow: hidden;

            background: linear-gradient(160deg, #e8f5ee 0%, #d4ede3 40%, #c5e4d7 100%);
            padding: 55px 32px 65px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;

            justify-content: space-between;
            color:var(--text);
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -60px; right: -60px;
            width: 240px; height: 240px;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
            pointer-events: none;
            z-index: 0;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -30px; left: -40px;
            width: 180px; height: 180px;
            border-radius: 50%;
            background: rgba(29,184,116,0.10);
            pointer-events: none;
            z-index: 0;
        }

        #Flexor{
            display:flex;
            flex-direction: column;
            border-radius: 10px;
            height: auto;
        }

        .hero h2, .hero p{
            margin:5px;
            z-index: 100;
        }

        .instruction{
            font-size: 12px;
            color: var(--grå);
            margin:10px 0px 20px 0px;
        }

        .nyhetsSkjema{
            display:flex;
            flex-direction: column;
            gap:20px;

            background-color: var(--white);
            border-radius: 20px 20px 0px 0px;
            padding:36px 28px 10px;
            z-index: 100;
            transform: translateY(-30px);
        }

        /* Tittel */
        .nyhetsSkjema h2{
            margin:0;
            font-size:24px;
            color: var(--text);
        }

        /* Felt wrapper */
        .field{
            display:flex;
            flex-direction:column;
            gap:6px;
        }

        /* Labels */
        .field label{
            font-weight:300;
            font-size:13px;
            color: var(--muted);
        }

        .field textarea{
            padding-top:10px;
            height: 60px;
        }

        /* Inputs */
        .field input, select, textarea{
            height:45px;
            padding:0 12px;
            border-radius:10px;
            border:1px solid var(--border);
            font-size:16px;
            transition:0.2s;
            background-color: transparent;
            width:100%;
            box-sizing:border-box;
        }

        .field input:focus, select:focus, textarea:focus{
            outline:none;
            border-color: var(--primærfarge);
        }

        /* Footer */
        .form-footer{
            display:flex;
            gap:10px;
            margin-top:10px;
        }

        /* Knapper */
        .form-footer button{
            height:50px;
            border:none;
            border-radius:12px;
            font-size:15px;
            cursor:pointer;
        }

        /* Avbryt */
        .cancel{
            flex:1;
            background:#f1f1f1;
            color:black;
            padding:10px 25px 10px 25px;
        }

        /* Lagre */
        .submit{
            flex:2;
            background: var(--primærfarge);
            color:white;
            font-weight:600;
        }

        /* Hover */
        .submit:hover{
            background:var(--primærfarge);
        }

        .cancel:hover{
            background:#e0e0e0;
        }

        select:invalid{
            color:var(--muted); /* grå */
        }

        select option{
            color:#111827; /* vanlig tekst */
        }

         /*_______________Responsiv Desktop________________*/

            @media (min-width:450px){
                #FlexGrid{
                    width:100%;
                    display:flex;
                    justify-content: center;
                    align-items: center;
                }

                #Flexor{
                    width:50%;
                    padding:20px;
                }
            }

    </style>
</head>
<body>
    <div id="FlexGrid">
    <div id="Flexor">
        <div class="hero">
            <h2><i>Registrer Arbeidstimer</i></h2>
            <p class="instruction">Logg arbeidet ditt og bygg opp profilen din</p>
        </div>
        
        <form id="training_form" class="nyhetsSkjema">

    <style>
        .wrappingbox{
            display:flex;
            flex-direction:row;
            gap:20px;
        }

        .wrappingbox .field{
            flex:1;
        }

         #faglitteratur{
                display:none;
        }
    </style>

    <div class="wrappingbox">

        <div class="field">
            <label>Dato</label>
            <input style="padding:0;" id="dato_value" type="date" required>
        </div>

        <div class="field">
            <label>Fokus / Energi</label>
            <select id="fokus_value" required>
                <option value="" selected disabled hidden>Velg...</option>
                    <option>1</option> <!-- - Svært dårlig -->
                    <option>2</option>  <!-- - Dårlig -->
                    <option>3</option>  <!-- - Distrahert -->
                    <option>4</option> <!-- - Normal -->
                    <option>5</option> <!-- - Greit -->
                    <option>6</option> <!-- - Bra -->
                    <option>7</option> <!-- - Godt fokus -->
                    <option>8</option> <!-- - Veldig fokusert -->
                    <option>9</option> <!-- - Nesten flyt -->
                    <option>10</option> <!-- - Full flyt -->
            </select>
        </div>
    </div>

    <div class="wrappingbox">
        <div class="field">
            <label>Start - tid</label>
            <input style="padding:0;" id="start_value" type="time" min="0" required>
        </div>

        <div class="field">
            <label>Slutt - tid</label>
            <input style="padding:0;" id="slutt_value" type="time" min="0" required>
        </div>
    </div>

    <style>
        .duration_lable{
            display:flex;
            flex-direction:row;
            align-items:center;
            gap:10px;
            background-color: #e3f3ed;
            padding:10px;
            border-radius: 8px;
            border: 1px solid #d0cfc8;
        }

        .duration_lable p, .duration_lable i{
            margin:0;
            color:var(--muted);
            font-size: 14px;
        }

        #active_tempo{
            font-weight: 600;
            color:var(--primærfarge);
        }
    </style>

    <div class="field">
        <div class="duration_lable">
            <i class="fa-regular fa-clock"></i>
            <p>Varighet:</p>
            <p id="active_tempo">-</p>
            <p>min</p>
        </div>
    </div>

        <style>
            .button {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 8px 14px;
                font-size: 13px;
                font-weight: 500;
                border: 0.5px solid #d0cfc8;
                border-radius: 999px;
                background: transparent;
                color: #5f5e5a;
                cursor: pointer;
                transition: background 0.12s, border-color 0.12s, color 0.12s;
                font-family: inherit;
            }

            .button:hover {
                background: #f1efe8;
                border-color: #b4b2a9;
            }

            .button.active {
                background: var(--primærfarge);
                border-color: var(--primærfarge);
                color: #ffffff;
            }
        </style>

        <div class="field">
            <label>Prosjekt / Kategori</label>
            <div style="display:flex; gap:5px; flex-wrap: wrap;">
                <div class="button"><i class="fa-solid fa-code"></i>Kode / Bygg</div>
                <div class="button"><i class="fa-regular fa-newspaper"></i>Lesing</div>
                <div class="button"><i class="fa-regular fa-comments"></i>Språk</div>
                <div class="button"><i class="fa-regular fa-clock"></i>Dyp fokus</div>
                <div class="button"><i class="fa-solid fa-chalkboard-user"></i>Planlegging</div>
                <div class="button"><i class="fa-regular fa-pen-to-square"></i>Skriving</div>
                <div class="button"><i class="fa-regular fa-file-word"></i>Prosjekt</div>
                <div class="button"><i class="fa-solid fa-video"></i>Video / Kurs</div>
                <div class="button"><i class="fa-brands fa-itunes-note"></i>Instrument</div>
                <div class="button"><i class="fa-solid fa-paintbrush"></i>Kreativt</div>
                <div class="button"><i class="fa-brands fa-sistrix"></i>Research</div>
            </div>
        </div>

        <div class="field">
            <label>Tittel / Tema</label>
            <input id="tema_value" placeholder="Mikrovaner - James Clear" maxlength="30">
        </div>

        <div class="field">
            <label>Notater</label>
            <textarea id="notat_value" placeholder="Hva gjorde du?" maxlength="250"></textarea>
        </div>

        <script>
            const buttons = document.querySelectorAll('.button');
            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    buttons.forEach(otherButton => {
                        otherButton.classList.remove('active');
                    });
                    button.classList.add('active');
                    if (button.classList.contains('active')) {
                        localStorage.setItem("kategori", button.innerText);
                        console.clear();
                        console.log(localStorage.getItem("kategori"));
                    }
                });
            });
        </script>

        <style>
            #innsats_value {
                appearance: none;
                height: 5px;
                padding: 0;
                border-radius: 999px;
                border: none;
                background: linear-gradient(to right, var(--primærfarge) 50%, #ddd 50%);
                cursor: pointer;
            }

            #innsats_value::-webkit-slider-thumb {
                appearance: none;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                background: var(--primærfarge);
                border: 2px solid white;
                box-shadow: 0 2px 6px rgba(0,0,0,0.18);
                cursor: pointer;
            }

            #innsats_value::-moz-range-thumb {
                width: 18px;
                height: 18px;
                border-radius: 50%;
                background: var(--primærfarge);
                border: 2px solid white;
                box-shadow: 0 2px 6px rgba(0,0,0,0.18);
                cursor: pointer;
            }

            #innsats_value:focus-visible {
                outline: 3px solid rgba(0,176,121,0.22);
                outline-offset: 4px;
            }
        </style>

        <div class="field">
            <label style="margin-bottom:8px;">Fremgang / Forbedring</label>
            <div style="display:flex; flex-direction:row; align-items:center;">
                <input id="innsats_value" type="range" min="1" max="10" value="5">
                <label id="active_label" style="width:60px; text-align:center;">5/10</label>
            </div>
        </div>

        <script>
            const slider = document.getElementById("innsats_value");
            const label = document.getElementById("active_label");

            function updateSlider() {
                const pct = ((slider.value - 1) / 9) * 100;
                slider.style.background = `linear-gradient(to right, var(--primærfarge) ${pct}%, #ddd ${pct}%)`;
                label.textContent = slider.value + "/10";
            }

            slider.addEventListener("input", updateSlider);
            updateSlider();
        </script>

        <style>
            .stats-wrapper{
                display:flex;
                gap:16px;
            }

            .stat-card{
                flex:1;
                background:white;
                border:1px solid #e5e7eb;
                border-radius:16px;
                padding:5px;
                text-align:center;
                box-shadow:0 6px 18px rgba(0,0,0,0.04);
                transition:0.2s;
            }

            .stat-card:hover{
                transform:translateY(-2px);
                box-shadow:0 10px 25px rgba(0,0,0,0.08);
            }

            .label{
                font-size:13px;
                color:#6b7280;
                margin:5px;
            }

            .value{
                font-size:20px;
                margin:5px;
                font-weight:700;
                color:#111827;
            }

            .value[id="active_tempo"]::after{
                content:" min";
                font-size:12px;
                color:#6b7280;
            }

             .value[id="active_point"]::before{
                content:"+ ";
                font-size:18px;
            }

             #active_point_2::after{
                content:" XP";
                font-size:12px;
            }

             #active_point_2::before{
                content:" +";
                font-size:12px;
            }

            #active_rating_value{
                color:var(--primærfarge);
                font-weight:700;
                font-size: 15px;
            }

        </style>

        <div class="stats-wrapper">

            <div class="stat-card">
                <p class="label">Rating</p>
                <p id="active_rating_value" class="value">-</p>
            </div>

            <div class="stat-card">
                <p class="label">XP</p>
                <p id="active_point" class="value">0</p>
            </div>
        </div>

        <div class="form-footer">
            <a href="../index.html"><button type="button" class="cancel">Avbryt</button></a>
            <button type="submit" id="send_data" class="submit">Lagre økt <i id="active_point_2"> 0 </i></button>
        </div>

        </div>

    </form>
    </div>
    </div>

    <script>
        // Placeholder for form submission logic
        const form = document.getElementById("training_form");
        const Submit = document.getElementById("send_data");

        form.addEventListener("submit", () => {
            Submit.disabled = true;
            Submit.innerText = "Sender...";
        });


        // Placeholder for Innsats slider logic
        const innsats = document.getElementById("innsats_value");
        const activeLabel = document.getElementById("active_label");
        innsats.addEventListener("input", () => {
            activeLabel.innerText = `${innsats.value}/10`;
        });


        // Placeholder for Varighet calculation
        const start_tid = document.getElementById("start_value");
        const slutt_tid = document.getElementById("slutt_value");
        const tempo = document.getElementById("active_tempo");

        function calculateTempo() {

            if (!start_tid.value || !slutt_tid.value) {
                tempo.innerText = "-";
                return;
            }

            const [startT, startM] = start_tid.value.split(":").map(Number);
            const [sluttT, sluttM] = slutt_tid.value.split(":").map(Number);

            const startMinutter = startT * 60 + startM;
            const sluttMinutter = sluttT * 60 + sluttM;

            const diff = sluttMinutter - startMinutter;
            localStorage.setItem("diff", diff);

            tempo.innerText = diff >= 0 ? diff : "-";

            
            // Placeholder for Rating calculation
                const rating = document.getElementById("active_rating_value");

                if(diff >= 180) rating.innerHTML = "★★★★★";
                else if(diff >= 120) rating.innerHTML = "★★★★☆";
                else if(diff >= 60) rating.innerHTML = "★★★☆☆";
                else if(diff >= 30) rating.innerHTML = "★★☆☆☆";
                else rating.innerHTML = "★☆☆☆☆";

        }
        start_tid.addEventListener("input", calculateTempo);
        slutt_tid.addEventListener("input", calculateTempo);


/* =============================================== XP Calculation Logic =============================================== */

         // Placeholder for XP calculation logic
        function calculateXP() {
            const point = document.getElementById("active_point");
            const point2 = document.getElementById("active_point_2");
            const tidsanslag = localStorage.getItem("diff");

            let totalxp = (tidsanslag / 8).toFixed(1);

            if (totalxp > 30) {
                totalxp = 30;
            }

            point.innerHTML = totalxp;
            point2.innerHTML = totalxp;
            localStorage.setItem("totalxp", totalxp);
        }
        [start_tid, slutt_tid].forEach((input) => {
            input.addEventListener("input", calculateXP);
        });
        
        
    </script>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabaseUrl = 'https://phvvbnmpujqyzqicdrrc.supabase.co'
        const supabaseKey = 'sb_publishable_owGo8PDUBRjA6l4Iq5RT0Q_N8w8Awhj'
        const supabase = createClient(supabaseUrl, supabaseKey)

        document.getElementById('training_form').addEventListener('submit', async (e) => {
        e.preventDefault()

        const { data: { user }} = await supabase.auth.getUser()

        if (!user) {
            alert("Ingen bruker er logget inn")
            return
        }

        const Dato = document.getElementById("dato_value").value;
        const Start_tid = document.getElementById("start_value").value;
        const Slutt_tid = document.getElementById("slutt_value").value;
        const Notat = document.getElementById("notat_value").value;
        const Innsats = document.getElementById("innsats_value").value;
        const Fokus = document.getElementById("fokus_value").value;
        const Tema  = document.getElementById("tema_value").value;
                
        const { error } = await supabase
                .from('bruker_data_produktivitet')
                .insert([{ user_id:user.id, dato:Dato, fokus:Fokus, kategori:localStorage.getItem("kategori"), varighet:localStorage.getItem("diff"), notat:Notat, fremgang:Innsats, xp:localStorage.getItem("totalxp"), tittel:Tema}])

            if (error) {
                Submit.innerText = "Noe gikk galt";
                alert('Feil: ' + error.message)
            } else {
                Submit.innerText = "Lagret ✓";
                alert('Arbeidsøkten ble lagt til!')
                window.location.href = '../index.html';
            }
        });
    </script>
</body>
</html>
