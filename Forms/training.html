<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../global.css">
    <script src="../global.js"></script>
    <link rel="stylesheet" href="forms.css">

    <!-- PWA / mobil optimalisering -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="white">

    <title>Registrer treningsøkt</title>
</head>
<body>
    <div id="FlexGrid">
    <div id="Flexor">
        <div class="hero">
            <h2><i>Registrer Treningsøkt</i></h2>
            <p class="instruction">Logg økten din og bygg opp profilen din</p>
        </div>
        
        <form id="training_form" class="nyhetsSkjema">

        <div class="field">
            <label>Dato</label>
            <input style="padding:0;" id="dato_value" type="date" required>
        </div>
    
    <div class="wrappingbox">
        <div class="field">
            <label>Aktivitet</label>
            <select id="aktivitet_value" required>
                <option value="" selected disabled hidden>Velg...</option>
                <optgroup label="--">
                    <option value="Løping">Løping</option>
                    <option value="Styrke">Styrke</option>
                    <option value="Sykling">Sykling</option>
                    <option value="Svømming">Svømming</option>
                    <option value="Langrenn">Langrenn</option>
                    <option value="Romaskin">Romaskin</option>
                    <option value="Ellipse">Ellipse</option>
                    <option value="Gåtur">Gåtur</option>
                </optgroup>

                    <optgroup label="--">
                        <option>Forebyggende</option>
                        <option>Annet</option>
                    </optgroup>
            </select>
        </div>

        <div class="field">
            <label>Type økt</label>
            <select id="type_value" required>
                    <option value="" selected disabled hidden>Velg...</option>
                    <option class="alternativ">- -</option>
                    <option class="alternativ">- -</option>
                    <option class="alternativ">- -</option>
                    <option class="alternativ">- -</option>
                    <option class="alternativ">- -</option>
                    <option class="alternativ">- -</option>
            </select>
        </div>
    </div>

    <style>
        #varighet_min_value{
            border-radius: 10px 0 0 10px;
        }

        #varighet_sek_value{
            border-radius: 0 10px 10px 0;
        }
    </style>

    <div class="wrappingbox">
        <div class="field">
            <label>Varighet (min : sek)</label>
            <div style="display:flex; gap:5px;">
                <input class="dobbel_duration" id="varighet_min_value" type="number" step="1" min="0" placeholder="60" required>
                <input class="dobbel_duration" id="varighet_sek_value" type="number" step="1" min="0" placeholder="35" required>
            </div>
        </div>

        <div class="field">
            <label>Distanse (km)</label>
            <input id="distanse_value" type="number" step="0.1" min="0" placeholder="8.5">
        </div>
    </div>

    <div class="wrappingbox">
        <div class="field">
            <label>Snittpuls</label>
            <input id="puls_value" type="number" min="0" placeholder="155">
        </div>

         <div class="field">
            <label>Makspuls</label>
            <input id="maxpuls_value" type="number" min="0" placeholder="175">
        </div>
    </div>

        <div class="field">
            <label>Notater</label>
            <textarea id="notat_value" placeholder="Hva gjorde du? Hvordan føltes det?" maxlength="500"></textarea>
        </div>

        <div class="field">
            <label style="margin-bottom:8px;">Opplevd intensitet</label>
            <div style="display:flex; flex-direction:row; align-items:center;">
                <input id="innsats_value" type="range" min="1" max="10" value="5">
                <label id="active_label" style="width:60px; text-align:center;">5/10</label>
            </div>
        </div>

        <script>
            const slider = document.getElementById("innsats_value");
            const label = document.getElementById("active_label");

            function updateSlider() {
                const pct = ((slider.value - 1) / 9) * 100;
                slider.style.background = `linear-gradient(to right, var(--primary-color) ${pct}%, #ddd ${pct}%)`;
                label.textContent = slider.value + "/10";
            }

            slider.addEventListener("input", updateSlider);
            updateSlider();
        </script>
    <style>
        .value[id="active_tempo"]::after {
            content: " /km";
            font-size: 12px;
            color: #6b7280;
        }
    </style>

        <div class="stats-wrapper">
            <div class="stat-card">
                <p class="label">Tempo</p>
                <p id="active_tempo" class="value">-</p>
            </div>

            <div class="stat-card">
                <p class="label">Belastning</p>
                <p id="active_belastning" class="value">-</p>
            </div>

            <div class="stat-card">
                <p class="label">XP</p>
                <p id="active_point" class="value">0</p>
            </div>
        </div>

        <div class="form-footer">
            <a href="../index.html"><button type="button" class="cancel">Avbryt</button></a>
            <button type="submit" id="send_data" class="submit">Lagre økt <i id="active_point_2"> 0 </i></button>
        </div>

        </div>

    </form>
    </div>
    </div>

    <script>
        const aktivitet = document.getElementById("aktivitet_value");
        const alternativ = document.querySelectorAll(".alternativ");

        function oppdaterAlternativ(aktType,alt1,alt2,alt3,alt4,alt5,alt6){
        if(aktivitet.value === aktType){
            alternativ[0].innerText = alt1;
            alternativ[1].innerText = alt2;
            alternativ[2].innerText = alt3;
            alternativ[3].innerText = alt4;
            alternativ[4].innerText = alt5;
            alternativ[5].innerText = alt6;


            alternativ.forEach(alt => {
                if (alt.innerText === "empty") {
                    alt.style.display = "none";
                } else {
                    alt.style.display = "block";
                }
            });

        }   else {
            alternativ.forEach(alt => alt.innerText = "- -");
        };
        };
        aktivitet.addEventListener("change", () => {
            if (aktivitet.value === "Løping")
                oppdaterAlternativ("Løping","Rolig økt","Intervall","Langtur","Oppvarming","Nedjogg","Stevne");

            else if (aktivitet.value === "Styrke")
                oppdaterAlternativ("Styrke","Underkropp","Overkropp","Fullkropp","empty","empty","empty");

            else if (aktivitet.value === "Sykling")
                oppdaterAlternativ("Sykling","Intervaller","Langtur","Tempoøkt","Stevne","Transport","empty");

            else if (aktivitet.value === "Svømming")
                oppdaterAlternativ("Svømming","Aquajogg","Kråling","Bryst","Rygg","empty","empty");

            else if (aktivitet.value === "Langrenn")
                oppdaterAlternativ("Langrenn","Rolig økt","Intervall","Langøkt","Tempoøkt","Stevne","empty");

            else if (aktivitet.value === "Forebyggende")
                oppdaterAlternativ("Forebyggende","Mobilitet","Uttøying","Foam Roler","Øvelser","empty","empty");

            else if (aktivitet.value === "Annet" || aktivitet.value === "Gåtur" || aktivitet.value === "Ellipse" || aktivitet.value === "Romaskin")
                oppdaterAlternativ(aktivitet.value,"Intervall","Lett økt","empty","empty","empty","empty");
                });
    </script>

    <script>
        // Forhåndsinstilling for dato i input field
        document.getElementById("dato_value").valueAsDate = new Date();
        

        // Placeholder for Duration calculation (min + sek) omgjort til desimaltall (50 min, 36 sek = 50.6)
        const min = document.getElementById("varighet_min_value");
        const sek = document.getElementById("varighet_sek_value");
        let totalDuration = 0;


        function calculateDuration(type) {
            type.addEventListener("input", (() => {
                totalDuration = (Number(min.value) + Number(sek.value) / 60);
                
                const rounded_duration = Number(totalDuration.toFixed(2));
                localStorage.setItem("duration", rounded_duration);
            }))
        }
        calculateDuration(min);
        calculateDuration(sek);
       

        // Placeholder for form submission logic
        const form = document.getElementById("training_form");
        const Submit = document.getElementById("send_data");

        form.addEventListener("submit", () => {
            Submit.disabled = true;
            Submit.innerText = "Sender...";
        });


        // Placeholder for Innsats slider logic
        const innsats = document.getElementById("innsats_value");
        const activeLabel = document.getElementById("active_label");
        innsats.addEventListener("input", () => {
            activeLabel.innerText = `${innsats.value}/10`;
        });


        // Placeholder for Tempo calculation
        const distanse_input_field = document.getElementById("distanse_value");
        const tempo = document.getElementById("active_tempo");

        function calculateTempo(type) {
            type.addEventListener("input", (() => {
                const totalSeconds = (totalDuration * 60)
                const secondsPerKm = totalSeconds / distanse_input_field.value;

                const calculatedTempo = (secondsPerKm / 60).toFixed(2);
                const minutter = Math.floor(calculatedTempo);
                const sekunder = ((calculatedTempo - minutter) * 60).toFixed(0);

                tempo.innerText = `${minutter}:${String(sekunder).padStart(2, "0")}`;

                if(isNaN(calculatedTempo) || !isFinite(calculatedTempo)) {
                    tempo.innerText = "-";
                }
            }));
        }
        calculateTempo(distanse_input_field);
        calculateTempo(min);
        calculateTempo(sek);


        // Placeholder for Belastning calculation
        const puls_numb = document.getElementById("puls_value");
        const maxpuls_numb = document.getElementById("maxpuls_value");  

        let calculated = totalDuration * ((puls_numb.value-60) / (maxpuls_numb.value-60))
        const belastning = document.getElementById("active_belastning");
        
        function calculateBelastning(type) {
            type.addEventListener("input", (() => {
                calculated = totalDuration * ((puls_numb.value-60) / (maxpuls_numb.value-60))
                belastning.innerText = calculated.toFixed(0);

                if(isNaN(calculated) || !isFinite(calculated)) {
                    belastning.innerText = "-";
                }
            }));
        }
        calculateBelastning(puls_numb);
        calculateBelastning(maxpuls_numb);
        calculateBelastning(min);
        calculateBelastning(sek);


/* =============================================== XP Calculation Logic =============================================== */

         // Placeholder for XP calculation logic
        const point = document.getElementById("active_point");
        const active_point_2 = document.getElementById("active_point_2");
        /* --- Forslag: XP = Grunnpoeng(basert på aktivitet) + Distanse/2 + Belastning/10 --- */
        /*      Grunnpoeng forslag:
                    Løping: 8 XP
                    Styrke: 6 XP
                    Sykling: 4 XP
                    Svømming: 7 XP
                    Langrenn: 4 XP
                    Forebyggende: 3 XP
                    Annet: 3 XP     */


        function updateStats() {
            console.clear();
            let count = 0;

            /* Legg til grunnpoeng basert på aktivitetstype */
            if(aktivitet.value === "Løping"){
                count += 8
                console.log("Aktvitetspoeng (løping): 8");
                if (distanse_input_field.value > 8) {
                    count += 2; // Bonus for distanser over 8 km
                    console.log("Bonuspoeng: 2 (Distanse over 8 km)");
                }
            } 

            else if(aktivitet.value === "Styrke"){
                count += 6
                console.log("Aktvitetspoeng (styrke): 6");
            }

            else if(aktivitet.value === "Sykling"){
                count += 4
                console.log("Aktvitetspoeng (sykling): 4");
                if (distanse_input_field.value > 20) {
                    count += 2; // Bonus for distanser over 20 km
                    console.log("Bonuspoeng: 2 (Distanse over 20 km)");
                }
            }
            
            else if(aktivitet.value === "Svømming"){
                count += 7
                console.log("Aktvitetspoeng (svømming): 7");
                if (distanse_input_field.value > 2) {
                    count += 2; // Bonus for distanser over 2 km
                    console.log("Bonuspoeng: 2 (Distanse over 2 km)");
                }
            }
            
            else if(aktivitet.value === "Langrenn"){
                count += 4
                console.log("Aktvitetspoeng (langrenn): 4");
                if (distanse_input_field.value > 15) {
                    count += 2; // Bonus for distanser over 15 km
                    console.log("Bonuspoeng: 2 (Distanse over 15 km)");
                }
            }
            
            else if(aktivitet.value === "Forebyggende" || aktivitet.value === "Annet" ||aktivitet.value === "Gåtur"){
                count += 2;
                console.log(`Aktvitetspoeng: 2 - ${aktivitet.value}`);
            }
            
            else if(aktivitet.value === "Ellipse" || aktivitet.value === "Romaskin"){
                count += 5;
                console.log(`Aktivitetspoeng: 5 - ${aktivitet.value}`);
            }
            
            else {
                point.innerText = "0";
            }

            let distanceFactor = 2; // Standard faktor for de fleste aktiviteter

            if(aktivitet.value === "Løping") {
                distanceFactor = 1.5; // Faktor for løping og langrenn
            }

            if(aktivitet.value === "Sykling") {
                distanceFactor = 4; // Faktor for sykling
            }

            if(aktivitet.value === "Svømming") {
                distanceFactor = 1; // Faktor for svømming
            }


            /* Legg til poeng basert på distanse og belastning */
            count += (distanse_input_field.value / distanceFactor) + (calculated / 10);
            console.log(`Distanse poeng: ${(distanse_input_field.value / distanceFactor).toFixed(2)}, Belastning poeng: ${(calculated / 10).toFixed(2)}`);

            const insatsValue = parseInt(innsats.value/3);
            count += insatsValue; // Legg til poeng basert på innsats
            console.log(`Innsats poeng: ${insatsValue}`);

            point.innerText = count.toFixed(1);
            active_point_2.innerText = count.toFixed(1);
            localStorage.setItem("point", count.toFixed(1));
        }

        [aktivitet,distanse_input_field, sek, min, puls_numb, maxpuls_numb, innsats].forEach(el => el.addEventListener("input", updateStats));

    </script>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabaseUrl = 'https://phvvbnmpujqyzqicdrrc.supabase.co'
        const supabaseKey = 'sb_publishable_owGo8PDUBRjA6l4Iq5RT0Q_N8w8Awhj'
        const supabase = createClient(supabaseUrl, supabaseKey)

        document.getElementById('training_form').addEventListener('submit', async (e) => {
        e.preventDefault()

        const { data: { user }} = await supabase.auth.getUser()

        if (!user) {
            alert("Ingen bruker er logget inn")
            return
        }

        const Type = document.getElementById("type_value").value;
        const Aktivitet = document.getElementById("aktivitet_value").value;
        const Dato = document.getElementById("dato_value").value;
        const Distanse = document.getElementById("distanse_value").value;
        const Puls = document.getElementById("puls_value").value;
        const MaxPuls = document.getElementById("maxpuls_value").value;
        const Notat = document.getElementById("notat_value").value;
        const Innsats = document.getElementById("innsats_value").value;
        
        const { error } = await supabase
                .from('bruker_data_trening')
                .insert([{ user_id:user.id, type:Type, aktivitet:Aktivitet, dato:Dato, varighet:localStorage.getItem("duration"), distanse:Distanse, gj_snitt_puls:Puls, maks_puls:MaxPuls, innsats:Innsats, notat:Notat, xp:localStorage.getItem("point") }])

            if (error) {
                Submit.innerText = "Noe gikk galt";
                alert('Feil: ' + error.message)
            } else {
                Submit.innerText = "Lagret ✓";
                alert('Treningsøkt ble lagt til!')
                window.location.href = '../index.html';
            }
        });
    </script>
</body>
</html>
