<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../global.css">
    <script src="../global.js"></script>
    <link rel="stylesheet" href="forms.css">

    <title>Registrer treningsøkt</title>
    <style>
        .wrappingbox {
            flex-direction: column;
            gap: 18px;
            padding: 20px;
            background: #fafafa;
            border: 1px solid rgba(29,184,116,0.16);
            border-radius: 14px;
        }

        .micro-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
        }

        .micro-action { display: flex; }

        .add-micro-btn {
            width: 100%;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            border-radius: 12px;
            background: white;
            color: var(--text);
            font-size: 15px;
            cursor: pointer;
        }

        .add-micro-btn:active {
            transform: translateY(0);
            box-shadow: 0 6px 14px rgba(29,184,116,0.20);
        }
    </style>
</head>
<body>
    <div id="FlexGrid">
    <div id="Flexor">
        <div class="hero">
            <h2><i>Registrer Mikroøkt</i></h2>
            <p class="instruction">Logg økten din og bygg opp profilen din</p>
        </div>
        
        <form class="nyhetsSkjema" id="mikro_form">

        <div class="field">
            <label>Dato</label>
            <input style="padding:0;" id="dato_value" type="date" required>
        </div>

    <section class="wrappingbox" aria-label="Legg til mikroøvelse">
        <article class="micro-row">
        <div class="field">
            <label>Aktivitet</label>
            <select id="aktivitet_value">
                <option value="" selected disabled hidden>Velg...</option>
                <optgroup label="Overkropp">
                    <option>Push-Ups</option>
                    <option>Triceps-Dips</option>
                    <option>Biceps Curls</option>
                </optgroup>

                <optgroup label="Kjerne">
                    <option>Sit-Ups</option>
                    <option>Crunches</option>
                    <option>Planke</option>
                    <option>Beinhev</option>
                    <option>Rygghev</option>
                    <option>Supermann</option>
                    <option>Bird-dog</option>
                    <option>Russian Twist</option>
                    <option>Ankel-touch</option>
                    <option>Side-Planke</option>
                </optgroup>

                <optgroup label="Underkropp">
                    <option>Knebøy</option>
                    <option>Utfall</option>
                    <option>Seteløft</option>
                    <option>Tåhev</option>
                    <option>Reverse Calf Raise</option>
                </optgroup>
            </select>
        </div>

        <div class="field">
            <label>Repetisjoner</label>
            <input id="repetisjoner_value" type="number" min="1" step="1" max="100">
        </div>
        </article>

        <div class="micro-action">
            <button id="micro_btn" type="button" class="add-micro-btn">
                <i class="fa-solid fa-plus"></i>
                <span>Legg til</span>
            </button>
        </div>
    </section>

    <style>
        .micro-list{
            display:flex;
            flex-direction:column;
            gap:16px;
            margin-top:8px;
        }

        .micro_activity{
            display:flex;
            flex-direction:row;
            justify-content: space-between;
            background-color: #fbfbfd;
            padding:12px;
            border-radius: 14px;
        }

        .micro_activity p{
            margin:0;
        }

        .circle_of_type{
            width:10px;
            height:10px;
            border-radius:50%;
            background-color: #1db874;
        }

        .micro_row{
            display:flex;
            flex-direction:row;
            gap:10px;
            align-items: center;
        }

        .øvelse_label{
            font-weight:300;
            font-size:13px;
            color: var(--muted);
        }
    </style>

    <section>
        <label class="øvelse_label">Registrerte Øvelser:</label>
        <div class="micro-list" id="micro-list">
            <!-- Her kommer øvelserne din laget med Javascript -->
        </div>
    </section>
    <style>
        .value[id="active_tempo"]::after {
            content: " stk";
            font-size: 12px;
            color: #6b7280;
        }
    </style>

    <div class="stats-wrapper">
        <div class="stat-card">
            <p class="label">Repetisjoner</p>
            <p id="active_reps" class="value">-</p>
        </div>

        <div class="stat-card">
            <p class="label">XP</p>
            <p id="active_point" class="value">0</p>
        </div>
    </div>

        <div class="form-footer">
            <a href="../index.html"><button type="button" class="cancel">Avbryt</button></a>
            <button type="submit" class="submit">Lagre økt</button>
        </div>
    </div>

    </form>
    </div>
    </div>

    <script>
        // Forhåndsinstilling for dato i input field
        document.getElementById("dato_value").valueAsDate = new Date();

        const micro_btn = document.getElementById("micro_btn");
        const micro_list = document.getElementById("micro-list");

        let totalreps = 0;
        window.microActivities = [];

        micro_btn.addEventListener("click", () => {
            const aktivitet = document.getElementById("aktivitet_value");
            const repetisjoner = document.getElementById("repetisjoner_value");

            if (aktivitet.value == "" || repetisjoner.value == "") {
                return;
            }

            const index = window.microActivities.findIndex(
                activity => activity.aktivitet.toLowerCase() === aktivitet.value.toLowerCase()
            );

            if (index !== -1) {
                const existing = window.microActivities[index];

                existing.repetisjoner += Number(repetisjoner.value);

                micro_list.children[index]
                    .querySelector(".repetisjoner")
                    .textContent = `${existing.repetisjoner} stk`;

            } else {
                window.microActivities.push({
                    aktivitet: aktivitet.value,
                    repetisjoner: Number(repetisjoner.value)
                });

                const micro_activity = document.createElement("div");
                micro_activity.classList.add("micro_activity");

                micro_activity.innerHTML = `
                    <span class="micro_row">
                        <div class="circle_of_type"></div>
                        <p class="aktivitet">${aktivitet.value}</p>
                    </span>
                    <p class="repetisjoner">${repetisjoner.value} stk</p>
                `;

                micro_list.appendChild(micro_activity);
            }

            totalreps += Number(repetisjoner.value);
            document.getElementById("active_reps").innerHTML = totalreps;
            localStorage.setItem("totalreps", totalreps);

            aktivitet.value = "";
            repetisjoner.value = "";
            
            // XP Calculations
            const point = totalreps / 15;
            document.getElementById("active_point").innerHTML = point.toFixed(1);
            localStorage.setItem("point", point.toFixed(1))
        });

    </script>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabaseUrl = 'https://phvvbnmpujqyzqicdrrc.supabase.co'
        const supabaseKey = 'sb_publishable_owGo8PDUBRjA6l4Iq5RT0Q_N8w8Awhj'
        const supabase = createClient(supabaseUrl, supabaseKey)

        document.getElementById('mikro_form').addEventListener('submit', async (e) => {
        e.preventDefault()

        const { data: { user }} = await supabase.auth.getUser()

        if (!user) {
            alert("Ingen bruker er logget inn")
            return
        }

        const dato = document.getElementById("dato_value").value;
        if (window.microActivities.length === 0) {
            alert("Legg til minst en aktivitet")
            return
        }

        const aktivitet = window.microActivities
            .map(activity => `${activity.aktivitet}: ${activity.repetisjoner}`)
            .join(", ");
        const repetisjoner = window.microActivities
            .reduce((sum, activity) => sum + activity.repetisjoner, 0);
        const xp = (repetisjoner / 15).toFixed(1);

        const { error } = await supabase
                .from('bruker_data_mikroøkt')
                .insert([{ user_id:user.id, aktivitet:aktivitet, dato:dato, repetisjoner:repetisjoner, xp:xp }])

            if (error) {
                alert('Feil: ' + error.message)
            } else {
                alert('Treningsøkt ble lagt til!')
                window.location.href = '../index.html';
            }
        });
    </script>

</body>
</html>
