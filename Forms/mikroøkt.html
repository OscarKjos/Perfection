<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../global.css">

    <title>Registrer treningsøkt</title>

    <style>
        :root{
            --border: #e0e0e0;
            --text: #333;
            --muted: #777;
        }

        body{
            font-family: var(--font);
            margin:0;
            background-color: var(--white);
        }

        .hero {
            position: relative;
            overflow: hidden;

            background: linear-gradient(160deg, #e8f5ee 0%, #d4ede3 40%, #c5e4d7 100%);
            padding: 55px 32px 65px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;

            justify-content: space-between;
            color:var(--text);
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -60px; right: -60px;
            width: 240px; height: 240px;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
            pointer-events: none;
            z-index: 0;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -30px; left: -40px;
            width: 180px; height: 180px;
            border-radius: 50%;
            background: rgba(29,184,116,0.10);
            pointer-events: none;
            z-index: 0;
        }

        #Flexor{
            display:flex;
            flex-direction: column;
            border-radius: 10px;
            height: auto;
        }

        .hero h2, .hero p{
            margin:5px;
            z-index: 100;
        }

        .instruction{
            font-size: 12px;
            color: var(--grå);
            margin:10px 0px 20px 0px;
        }

        .nyhetsSkjema{
            display:flex;
            flex-direction: column;
            gap:20px;

            background-color: var(--white);
            border-radius: 20px 20px 0px 0px;
            padding:36px 28px 10px;
            z-index: 100;
            transform: translateY(-30px);
        }

        .field{
            display:flex;
            flex-direction:column;
            gap:6px;
        }

        /* Labels */
        .field label{
            font-weight:300;
            font-size:13px;
            color: var(--muted);
        }

        .field input, select{
            height:45px;
            padding:0 12px;
            border-radius:10px;
            border:1px solid var(--border);
            font-size:16px;
            transition:0.2s;
            background-color: transparent;
            width:100%;
            box-sizing:border-box;
        }

        .field input:focus, select:focus{
            outline:none;
            border-color: var(--primary-color);
        }

        /* Footer */
        .form-footer{
            display:flex;
            gap:10px;
            margin-top:10px;
        }

        /* Knapper */
        .form-footer button{
            height:50px;
            border:none;
            border-radius:12px;
            font-size:15px;
            cursor:pointer;
        }

        /* Avbryt */
        .cancel{
            flex:1;
            background:#f1f1f1;
            color:black;
            padding:10px 25px 10px 25px;
        }

        /* Lagre */
        .submit{
            flex:2;
            background: var(--primary-color);
            color:white;
            font-weight:600;
        }

        /* Hover */
        .submit:hover{
            background:var(--primary-color);
        }

        .cancel:hover{
            background:#e0e0e0;
        }

        select:invalid{
            color:var(--muted); /* grå */
        }

        select option{
            color:#111827; /* vanlig tekst */
        }

        .wrappingbox{
            display:flex;
            flex-direction:column;
            gap:18px;
            padding:20px;
            background: #e3f3ed;
            border:1px solid rgba(29,184,116,0.16);
            border-radius: 14px;
        }

        .micro-row{
            display:flex;
            flex-direction:row;
            gap:16px;
            align-items:flex-end;
        }

        .wrappingbox .field{
            flex:1;
        }

        .micro-action{
            display:flex;
        }

        .add-micro-btn{
            width:100%;
            min-height:48px;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
            border:none;
            border-radius:12px;
            background:white;
            color:var(--text);
            font-size:15px;
            cursor:pointer;
            box-shadow:0 8px 18px rgba(29,184,116,0.20);
            transition:transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .add-micro-btn:hover{
            transform:translateY(-1px);
            box-shadow:0 12px 24px rgba(29,184,116,0.28);
        }

        .add-micro-btn:active{
            transform:translateY(0);
            box-shadow:0 6px 14px rgba(29,184,116,0.20);
        }

         /*_______________Responsiv Desktop________________*/

            @media (min-width:450px){
                #FlexGrid{
                    width:100%;
                    display:flex;
                    justify-content: center;
                    align-items: center;
                }

                #Flexor{
                    width:50%;
                    padding:20px;
                }
            }

    </style>
</head>
<body>
    <div id="FlexGrid">
    <div id="Flexor">
        <div class="hero">
            <h2><i>Registrer Mikroøkt</i></h2>
            <p class="instruction">Logg økten din og bygg opp profilen din</p>
        </div>
        
        <form class="nyhetsSkjema" id="mikro_form">

        <div class="field">
            <label>Dato</label>
            <input style="padding:0;" id="dato_value" type="date" required>
        </div>

    <section class="wrappingbox" aria-label="Legg til mikroøvelse">
        <article class="micro-row">
        <div class="field">
            <label>Aktivitet</label>
            <select id="aktivitet_value">
                <option value="" selected disabled hidden>Velg...</option>
                <optgroup label="Overkropp">
                    <option>Push-Ups</option>
                    <option>Triceps-Dips</option>
                    <option>Biceps Curls</option>
                </optgroup>

                <optgroup label="Kjerne">
                    <option>Sit-Ups</option>
                    <option>Crunches</option>
                    <option>Planke</option>
                    <option>Beinhev</option>
                    <option>Rygghev</option>
                    <option>Supermann</option>
                    <option>Bird-dog</option>
                    <option>Russian Twist</option>
                    <option>Ankel-touch</option>
                    <option>Side-Planke</option>
                </optgroup>

                <optgroup label="Underkropp">
                    <option>Knebøy</option>
                    <option>Utfall</option>
                    <option>Seteløft</option>
                    <option>Tåhev</option>
                    <option>Reverse Calf Raise</option>
                </optgroup>
            </select>
        </div>

        <div class="field">
            <label>Repetisjoner</label>
            <input id="repetisjoner_value" type="number" min="1" step="1" max="100">
        </div>
        </article>

        <div class="micro-action">
            <button id="micro_btn" type="button" class="add-micro-btn">
                <i class="fa-solid fa-plus"></i>
                <span>Legg til</span>
            </button>
        </div>
    </section>

    <style>
        .micro-list{
            display:flex;
            flex-direction:column;
            gap:16px;
            margin-top:8px;
        }

        .micro_activity{
            display:flex;
            flex-direction:row;
            justify-content: space-between;
            background-color: #d4ede36a;
            padding:12px;
            border-radius: 14px;
        }

        .micro_activity p{
            margin:0;
        }

        .circle_of_type{
            width:10px;
            height:10px;
            border-radius:50%;
            background-color: #1db874;
        }

        .micro_row{
            display:flex;
            flex-direction:row;
            gap:10px;
            align-items: center;
        }

        .øvelse_label{
            font-weight:300;
            font-size:13px;
            color: var(--muted);
        }
    </style>

    <section>
        <label class="øvelse_label">Registrerte Øvelser:</label>
        <div class="micro-list" id="micro-list">
            <!-- Her kommer øvelserne din laget med Javascript -->
        </div>
    </section>

    <style>
        .stats-wrapper{
            display:flex;
            gap:16px;
        }

        .stat-card{
            flex:1;
            background:white;
            border:1px solid #e5e7eb;
            border-radius:16px;
            padding:5px;
            text-align:center;
            box-shadow:0 6px 18px rgba(0,0,0,0.04);
            transition:0.2s;
        }

        .stat-card:hover{
            transform:translateY(-2px);
            box-shadow:0 10px 25px rgba(0,0,0,0.08);
        }

        .label{
            font-size:13px;
            color:#6b7280;
            margin:5px;
        }

        .value{
            font-size:20px;
            margin:5px;
            font-weight:700;
            color:#111827;
        }

        .value[id="active_tempo"]::after{
            content:" stk";
            font-size:12px;
            color:#6b7280;
        }

        .value[id="active_point"]::before{
            content:"+ ";
            font-size:18px;
        }

        #active_point_2::after{
            content:" XP";
            font-size:12px;
        }

            #active_point_2::before{
            content:" +";
            font-size:12px;
        }
    </style>

    <div class="stats-wrapper">
        <div class="stat-card">
            <p class="label">Repetisjoner</p>
            <p id="active_reps" class="value">-</p>
        </div>

        <div class="stat-card">
            <p class="label">XP</p>
            <p id="active_point" class="value">0</p>
        </div>
    </div>

        <div class="form-footer">
            <a href="../index.html"><button type="button" class="cancel">Avbryt</button></a>
            <button type="submit" class="submit">Lagre økt</button>
        </div>
    </div>

    </form>
    </div>
    </div>

    <script>
        // Forhåndsinstilling for dato i input field
        document.getElementById("dato_value").valueAsDate = new Date();

        const micro_btn = document.getElementById("micro_btn");
        const micro_list = document.getElementById("micro-list");

        let totalreps = 0;
        window.microActivities = [];

        micro_btn.addEventListener("click", () => {
            const aktivitet = document.getElementById("aktivitet_value");
            const repetisjoner = document.getElementById("repetisjoner_value");

            if (aktivitet.value == "" || repetisjoner.value == "") {
                return;
            }

            window.microActivities.push({
                aktivitet: aktivitet.value,
                repetisjoner: Number(repetisjoner.value)
            });

            const micro_activity = document.createElement("div");
            micro_activity.classList.add("micro_activity");

            micro_activity.innerHTML = `
                <span class="micro_row">
                    <div class="circle_of_type"></div>
                    <p class="aktivitet">${aktivitet.value}</p>
                </span>
                <p class="repetisjoner">${repetisjoner.value} stk</p>
            `;
            micro_list.appendChild(micro_activity);

            totalreps += Number(repetisjoner.value);
            document.getElementById("active_reps").innerHTML = totalreps;
            localStorage.setItem("totalreps", totalreps);

            aktivitet.value = "";
            repetisjoner.value = "";
            
            // XP Calculations
            const point = totalreps / 15;
            document.getElementById("active_point").innerHTML = point.toFixed(1);
            localStorage.setItem("point", point.toFixed(1))
        });

    </script>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabaseUrl = 'https://phvvbnmpujqyzqicdrrc.supabase.co'
        const supabaseKey = 'sb_publishable_owGo8PDUBRjA6l4Iq5RT0Q_N8w8Awhj'
        const supabase = createClient(supabaseUrl, supabaseKey)

        document.getElementById('mikro_form').addEventListener('submit', async (e) => {
        e.preventDefault()

        const { data: { user }} = await supabase.auth.getUser()

        if (!user) {
            alert("Ingen bruker er logget inn")
            return
        }

        const dato = document.getElementById("dato_value").value;
        if (window.microActivities.length === 0) {
            alert("Legg til minst en aktivitet")
            return
        }

        const aktivitet = window.microActivities
            .map(activity => `${activity.aktivitet}: ${activity.repetisjoner}`)
            .join(", ");
        const repetisjoner = window.microActivities
            .reduce((sum, activity) => sum + activity.repetisjoner, 0);
        const xp = (repetisjoner / 15).toFixed(1);

        const { error } = await supabase
                .from('bruker_data_mikroøkt')
                .insert([{ user_id:user.id, aktivitet:aktivitet, dato:dato, repetisjoner:repetisjoner, xp:xp }])

            if (error) {
                alert('Feil: ' + error.message)
            } else {
                alert('Treningsøkt ble lagt til!')
                window.location.href = '../index.html';
            }
        });
    </script>

</body>
</html>
