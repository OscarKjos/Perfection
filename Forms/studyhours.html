<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../global.css">
    <script src="../global.js"></script>
    <link rel="stylesheet" href="forms.css">

    <!-- PWA / mobil optimalisering -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="white">

    <title>Registrer studietimer</title>
</head>
<body>
    <div id="FlexGrid">
    <div id="Flexor">
        <div class="hero">
            <h2><i>Registrer Studietimer</i></h2>
            <p class="instruction">Logg arbeidet ditt og bygg opp profilen din</p>
        </div>
        
        <form id="training_form" class="nyhetsSkjema">

        <div class="field">
            <label>Dato</label>
            <input style="padding:0;" id="dato_value" type="date" required>
        </div>
    
    <div class="wrappingbox">
        <div class="field">
            <label>Fagområde</label>
            <select id="fagområde_value" required>
                <option value="" selected disabled hidden>Velg...</option>
                <optgroup label="Realfag">
                    <option>Kjemi</option>
                    <option>Biologi</option>
                    <option>Fysikkk</option>
                    <option>Mattematikk</option>
                    <option>IT-fag</option>
                    <option>Geografi</option>
                    <option>Naturfag</option>
                </optgroup>

                <optgroup label="Språk">
                    <option>Engelsk</option>
                    <option>Norsk</option>
                    <option>Spansk</option>
                    <option>Tysk</option>
                    <option>Fransk</option>
                    <option>Svensk</option>
                </optgroup>

                <optgroup label="Samfunnsfag">
                    <option>Samfunnskunnskap</option>
                    <option>Historie</option>
                    <option>Psykologi</option>
                    <option>Politikk</option>
                    <option>Rettslære</option>
                    <option>Sosialkunnskap</option>
                </optgroup>

                <optgroup label="Økonomi">
                    <option>Entrepenørskap</option>
                    <option>Markedsføring</option>
                    <option>Økonomi-fag</option>
                </optgroup>
            </select>
        </div>

        <div class="field">
            <label>Studiemetode</label>
            <select id="type_value" required>
                    <option value="" selected disabled hidden>Velg...</option>
                    <option class="alternativ">Oppgaver</option>
                    <option class="alternativ">Notater</option>
                    <option class="alternativ">Flashcards</option>
                    <option class="alternativ">Video / Podcast</option>
                    <option class="alternativ">Gruppe</option>
                    <option class="alternativ">Repetisjon</option>
                    <option class="alternativ">Forståelse</option>
                    <option class="alternativ">Lesing</option>
                    <option class="alternativ">Forberedelse</option>
                    <option class="alternativ">Skriv / øv</option>
            </select>
        </div>
    </div>

    <div class="wrappingbox">
        <div class="field">
            <label>Start - tid</label>
            <input style="padding:0;" id="start_value" type="time" min="0" required>
        </div>

        <div class="field">
            <label>Slutt - tid</label>
            <input style="padding:0;"id="slutt_value" type="time" min="0" required>
        </div>
    </div>

        <div class="field">
            <label>Notater</label>
            <textarea id="notat_value" placeholder="Hva lærte du? Hva var vanskelig?" maxlength="500"></textarea>
        </div>

        <style>
            .button {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 8px 14px;
                font-size: 13px;
                font-weight: 500;
                border: 0.5px solid #d0cfc8;
                border-radius: 999px;
                background: transparent;
                color: #5f5e5a;
                cursor: pointer;
                transition: background 0.12s, border-color 0.12s, color 0.12s;
                font-family: inherit;
            }

            .button:hover {
                background: #f1efe8;
                border-color: #b4b2a9;
            }

            .button.active {
                background: var(--primary-color);
                border-color: var(--primary-color);
                color: #ffffff;
            }
        </style>

        <div class="field">
            <label>Sted</label>
            <div>
                <div class="button">Hjemme</div>
                <div class="button">Skole</div>
                <div class="button">Bibliotek</div>
                <div class="button">Kafé</div>
            </div>
        </div>

        <script>
            const buttons = document.querySelectorAll('.button');
            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    buttons.forEach(otherButton => {
                        otherButton.classList.remove('active');
                    });
                    button.classList.add('active');
                    if (button.classList.contains('active')) {
                        localStorage.setItem("sted", button.innerText);
                        console.clear();
                        console.log(localStorage.getItem("sted"));
                    }
                });
            });
        </script>

       <div class="field">
            <label style="margin-bottom:8px;">Fremgang / Forbedring</label>
            <div style="display:flex; flex-direction:row; align-items:center;">
                <input id="innsats_value" type="range" min="1" max="10" value="5">
                <label id="active_label" style="width:60px; text-align:center;">5/10</label>
            </div>
        </div>

        <script>
            const slider = document.getElementById("innsats_value");
            const label = document.getElementById("active_label");

            function updateSlider() {
                const pct = ((slider.value - 1) / 9) * 100;
                slider.style.background = `linear-gradient(to right, var(--primary-color) ${pct}%, #ddd ${pct}%)`;
                label.textContent = slider.value + "/10";
            }

            slider.addEventListener("input", updateSlider);
            updateSlider();
        </script>
    <style>
        .value[id="active_tempo"]::after {
            content: " min";
            font-size: 12px;
            color: #6b7280;
        }

        #active_rating_value {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 15px;
        }
    </style>

        <div class="stats-wrapper">
            <div class="stat-card">
                <p class="label">Varighet</p>
                <p id="active_tempo" class="value">-</p>
            </div>

            <div class="stat-card">
                <p class="label">Rating</p>
                <p id="active_rating_value" class="value">-</p>
            </div>

            <div class="stat-card">
                <p class="label">XP</p>
                <p id="active_point" class="value">0</p>
            </div>
        </div>

        <div class="form-footer">
            <a href="../index.html"><button type="button" class="cancel">Avbryt</button></a>
            <button type="submit" id="send_data" class="submit">Lagre økt <i id="active_point_2"> 0 </i></button>
        </div>

        </div>

    </form>
    </div>
    </div>

    <script>
        // Forhåndsinstilling for dato i input field
        document.getElementById("dato_value").valueAsDate = new Date();

        // Placeholder for form submission logic
        const form = document.getElementById("training_form");
        const Submit = document.getElementById("send_data");

        form.addEventListener("submit", () => {
            Submit.disabled = true;
            Submit.innerText = "Sender...";
        });


        // Placeholder for Innsats slider logic
        const innsats = document.getElementById("innsats_value");
        const activeLabel = document.getElementById("active_label");
        innsats.addEventListener("input", () => {
            activeLabel.innerText = `${innsats.value}/10`;
        });


        // Placeholder for Varighet calculation
        const start_tid = document.getElementById("start_value");
        const slutt_tid = document.getElementById("slutt_value");
        const tempo = document.getElementById("active_tempo");

        function calculateTempo() {

            if (!start_tid.value || !slutt_tid.value) {
                tempo.innerText = "-";
                return;
            }

            const [startT, startM] = start_tid.value.split(":").map(Number);
            const [sluttT, sluttM] = slutt_tid.value.split(":").map(Number);

            const startMinutter = startT * 60 + startM;
            const sluttMinutter = sluttT * 60 + sluttM;

            const diff = sluttMinutter - startMinutter;
            localStorage.setItem("diff", diff);

            tempo.innerText = diff >= 0 ? diff : "-";

            
            // Placeholder for Rating calculation
                const rating = document.getElementById("active_rating_value");

                if(diff >= 180) rating.innerHTML = "★★★★★";
                else if(diff >= 120) rating.innerHTML = "★★★★☆";
                else if(diff >= 60) rating.innerHTML = "★★★☆☆";
                else if(diff >= 30) rating.innerHTML = "★★☆☆☆";
                else rating.innerHTML = "★☆☆☆☆";

        }
        start_tid.addEventListener("input", calculateTempo);
        slutt_tid.addEventListener("input", calculateTempo);


/* =============================================== XP Calculation Logic =============================================== */

         // Placeholder for XP calculation logic
        
        function calculateXP() {
            const point = document.getElementById("active_point");
            const point2 = document.getElementById("active_point_2");
            const tidsanslag = localStorage.getItem("diff");

            let totalxp = (tidsanslag / 8).toFixed(1);

            if (totalxp > 30) {
                totalxp = 30;
            }

            point.innerHTML = totalxp;
            point2.innerHTML = totalxp;
            localStorage.setItem("totalxp", totalxp);
        }
        [start_tid, slutt_tid].forEach((input) => {
            input.addEventListener("input", calculateXP);
        });
        
        
    </script>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabaseUrl = 'https://phvvbnmpujqyzqicdrrc.supabase.co'
        const supabaseKey = 'sb_publishable_owGo8PDUBRjA6l4Iq5RT0Q_N8w8Awhj'
        const supabase = createClient(supabaseUrl, supabaseKey)

        document.getElementById('training_form').addEventListener('submit', async (e) => {
        e.preventDefault()

        const { data: { user }} = await supabase.auth.getUser()

        if (!user) {
            alert("Ingen bruker er logget inn")
            return
        }

        const Type = document.getElementById("type_value").value;
        const Dato = document.getElementById("dato_value").value;
        const Start_tid = document.getElementById("start_value").value;
        const Slutt_tid = document.getElementById("slutt_value").value;
        const Notat = document.getElementById("notat_value").value;
        const Innsats = document.getElementById("innsats_value").value;
        const Fagområde = document.getElementById("fagområde_value").value;

        
        const { error } = await supabase
                .from('bruker_data_studie')
                .insert([{ user_id:user.id, dato:Dato, fagområde:Fagområde, studiemetode:Type, varighet:localStorage.getItem("diff"), notater:Notat, sted:localStorage.getItem("sted"), fokus:Innsats, xp:localStorage.getItem("totalxp"),}])

            if (error) {
                Submit.innerText = "Noe gikk galt";
                alert('Feil: ' + error.message)
            } else {
                Submit.innerText = "Lagret ✓";
                alert('Studieøkten ble lagt til!')
                window.location.href = '../index.html';
            }
        });
    </script>
</body>
</html>
