<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plyzaro – Logg inn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<meta name="theme-color" content="white">
<link rel="manifest" href="manifest.json">

    <!-- Ikoner for ulike enheter -->
    <link rel="icon" type="image/png" sizes="32x32" href="Bilder/ikoner/logo_webb.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="Bilder/ikoner/logo_webb.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="Bilder/ikoner/logo_light.png"> 

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --green: #1DB874;
            --primærfarge: #1DB874;
            --green-dark: #17a063;
            --green-light: #e8f7f1;
            --green-text: #0d6e45;
            --bg: #f0f5f2;
            --white: #ffffff;
            --text: #141414;
            --muted: #7a8a84;
            --border: #d6e4dc;
            --input-bg: #f8fbf9;
            --radius: 16px;
            --radius-sm: 10px;
        }

        html, body {
            height: 100%;
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .page {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background: var(--white);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Hero top section */
        .hero {
            position: relative;
            background: linear-gradient(160deg, #e8f5ee 0%, #d4ede3 40%, #c5e4d7 100%);
            padding: 55px 32px 65px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -60px; right: -60px;
            width: 240px; height: 240px;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
            pointer-events: none;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -30px; left: -40px;
            width: 180px; height: 180px;
            border-radius: 50%;
            background: rgba(29,184,116,0.10);
            pointer-events: none;
        }

        .logo-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            position: relative;
            z-index: 1;
        }

        .logo-icon {
            width: 52px;
            height: 52px;
            background: var(--green);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(29,184,116,0.28);
        }

        .logo-icon svg {
            width: 28px; height: 28px;
            fill: white;
        }

        .logo-name {
            font-family: 'Sora', sans-serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--text);
        }

        .tagline {
            font-size: 15px;
            color: #4a6b5c;
            letter-spacing: 0.01em;
            position: relative;
            z-index: 1;
        }

        .tagline span {
            color: var(--green-dark);
            font-weight: 500;
        }

        /* Card form */
        .card {
            background: var(--white);
            border-radius: 28px 28px 0 0;
            margin-top: -24px;
            position: relative;
            z-index: 2;
            padding: 36px 28px 15px 28px;
            flex: 1;
            box-shadow: 0 -4px 24px rgba(0,0,0,0.06);
        }

        .card-heading {
            font-family: 'Sora', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .card-sub {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 32px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 28px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .field label {
            font-size: 13px;
            font-weight: 500;
            color: #3a4a43;
            letter-spacing: 0.01em;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--green);
            display: flex;
            align-items: center;
            pointer-events: none;
        }

        .input-icon svg {
            width: 18px; height: 18px;
            stroke: var(--green);
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .input-wrap input {
            width: 100%;
            height: 52px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--input-bg);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            color: var(--text);
            padding: 0 44px 0 44px;
            outline: none;
            transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
            -webkit-appearance: none;
            font-size: 16px;
        }

        .input-wrap input::placeholder {
            color: #b2bfb9;
        }

        .input-wrap input:focus {
            border-color: var(--green);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(29,184,116,0.12);
        }

        .toggle-pw {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--muted);
            padding: 4px;
            display: flex;
            align-items: center;
            transition: color 0.15s;
        }

        .toggle-pw:hover { color: var(--green); }

        .toggle-pw svg {
            width: 18px; height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .forgot-row {
            display: flex;
            justify-content: flex-end;
            margin: 6px 0 28px;
        }

        .forgot-link {
            font-size: 13px;
            color: var(--green-dark);
            font-weight: 500;
            text-decoration: none;
            transition: opacity 0.15s;
        }
        .forgot-link:hover { opacity: 0.75; }

        .btn-primary {
            width: 100%;
            height: 54px;
            border-radius: var(--radius);
            background: var(--green);
            color: white;
            font-family: 'Sora', sans-serif;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            letter-spacing: 0.01em;
            transition: background 0.18s, transform 0.12s, box-shadow 0.18s;
            box-shadow: 0 4px 18px rgba(29,184,116,0.28);
        }

        .btn-primary:hover {
            background: var(--green-dark);
            box-shadow: 0 6px 22px rgba(29,184,116,0.35);
        }

        .btn-primary:active {
            transform: scale(0.98);
            box-shadow: 0 2px 10px rgba(29,184,116,0.22);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 28px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider-text {
            font-size: 13px;
            color: var(--muted);
            white-space: nowrap;
        }

        .social-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 32px;
        }

        .social-btn {
            width: 68px;
            height: 52px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s, transform 0.12s;
            flex: 1;
            max-width: 100px;
        }

        .social-btn:hover {
            border-color: #aac8ba;
            background: var(--input-bg);
        }

        .social-btn:active { transform: scale(0.97); }

        .social-btn svg {
            width: 22px; height: 22px;
        }

        .register-row {
            text-align: center;
            font-size: 14px;
            color: var(--muted);
        }

        .register-row a {
            color: var(--green-dark);
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.15s;
        }
        .register-row a:hover { opacity: 0.75; }
    </style>
</head>
<body>
<main class="page" role="main">

  <div class="hero">
    <div class="logo-wrap">
      <div class="logo-icon">
        <img width="40px" src="Bilder/ikoner/splash_screen.png" alt="Logo">
      </div>
      <span class="logo-name"><i>Plyzaro</i></span>
    </div>
    <p class="tagline">Bli <span>bedre</span>. Hver dag.</p>
  </div>

  <div class="card">
    <h1 class="card-heading">Velkommen tilbake!</h1>
    <p class="card-sub">Logg inn for å fortsette reisen din.</p>

    <div class="field-group">
      <div class="field">
        <label for="email">E-post</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
          </span>
          <input type="email" id="email" name="email" placeholder="din@epost.no" autocomplete="email" />
        </div>
      </div>

      <div class="field">
        <label for="password">Passord</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input type="password" id="password" name="password" placeholder="Ditt passord" autocomplete="current-password" />
          <button type="button" class="toggle-pw" aria-label="Vis/skjul passord" onclick="togglePassword()">
            <svg id="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
    </div>

    <button id="Knapp" class="btn-primary" type="button" onclick="handleLogin()">Logg inn</button>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text register-row">Har du ikke en konto?<a href="#"> Opprett en</a></span>
      <div class="divider-line"></div>
    </div>

  </div>

</main>

        <style>
        #splash_screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1DB874, #0f6b47);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        /* Center container */
        .splash_content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transform: translateY(-10%);
        }

        /* Logo */
        .splash_logo {
            font-size: 72px;
            color: white;
            width:150px;
        }

        /* App name */
        .splash_title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.95);
        }

        </style>

        <div id="splash_screen">
            <div class="splash_content">
                <img class="splash_logo" src="Bilder/ikoner/splash_screen.png" alt="Logo">
                <div class="splash_title">Plyzaro</div>
            </div>
        </div>

        <script>
            window.addEventListener("load", () => {
                if (sessionStorage.getItem("splash_vist") === "true") {
                    document.getElementById("splash_screen").style.display = "none";
                    settThemeColor('white');
                }
            
            settThemeColor('#1DB874');

            setTimeout(() => {
                document.getElementById("splash_screen").style.display = "none";
                settThemeColor('white');
                sessionStorage.setItem("splash_vist", "true");
            }, 3000); // 3 sekunder
        });

        /* ================= Dynamisk tema farge =================== */
        function settThemeColor(farge) {
            const meta = document.querySelector('meta[name="theme-color"]');
            
            if (meta) {
                meta.setAttribute("content", farge);
            }
        }
        </script>

<script>

  function togglePassword() {
    const input = document.getElementById('password');
    const icon = document.getElementById('eye-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
      input.type = 'password';
      icon.innerHTML = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
    }
  }


  function handleLogin() {
    const btn = document.querySelector('.btn-primary');
    btn.textContent = 'Logger inn…';
    btn.style.opacity = '0.8';
    btn.style.pointerEvents = 'none';
    setTimeout(() => {
      btn.textContent = 'Logg inn';
      btn.style.opacity = '';
      btn.style.pointerEvents = '';
    }, 2000);
  }

  document.getElementById('email').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });
</script>

<script type="module">
      import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

      const supabaseUrl = 'https://phvvbnmpujqyzqicdrrc.supabase.co'
      const supabaseKey = 'sb_publishable_owGo8PDUBRjA6l4Iq5RT0Q_N8w8Awhj'
      const supabase = createClient(supabaseUrl, supabaseKey)

        async function sjekkLogin() {
            const { data } = await supabase.auth.getUser();

            if (data.user) {
                window.location.href = "index.html";
            }
        }
        sjekkLogin();

      const Knapp = document.getElementById("Knapp");
      const Email = document.getElementById("email");
      const Passord = document.getElementById("password");

      Knapp.addEventListener("click", async () => {
          const { data, error } = await supabase.auth.signInWithPassword({
            email: Email.value,
            password: Passord.value
          });

          if (error) {
              Knapp.textContent = "Logg inn";
              Knapp.style.opacity = "";
              Knapp.style.pointerEvents = "";
              alert(error.message);
          } else {
              window.location.href = "index.html";
          }
      });
</script>
</body>
</html>
