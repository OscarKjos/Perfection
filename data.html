    <style>
        #section_part{
            display:flex;
            flex-direction: column;
            gap:12px;
            position: relative;
            width:100%;
            overflow: hidden;
            padding:12px;
            box-sizing:border-box;
        }


         #search_top_bar{
            background-color: white;
            padding:12px;
            border-radius: 14px;
            display:flex;
            flex-direction: column;
            gap:12px;
            border:1px solid #e7eaf1;
            box-shadow:0 8px 24px rgba(17,24,39,0.06);
        }

        #search_relative{
            position: relative;
            width:100%;
            display:flex;
            align-items:center;
        }

        #search_top_bar input{
            height:44px;
            padding:0 42px 0 40px;
            background-color: #f6f8fb;
            border:#e7eaf1 solid 1px;
            border-radius: 10px;
            width:100%;
            font-size: 16px;
            box-sizing: border-box;
            outline:none;
            transition:border-color 0.16s, box-shadow 0.16s, background 0.16s;
        }

        #search_top_bar input:focus{
            background:white;
            border-color:var(--primary-color);
            box-shadow:0 0 0 3px rgba(0,176,121,0.12);
        }

        .search-icon{
            position: absolute;
            top:50%;
            left:14px;
            transform: translateY(-50%);
            color:#6b7280;
            pointer-events:none;
        }

        #clear_search{
            position:absolute;
            right:8px;
            width:30px;
            height:30px;
            border:none;
            border-radius:8px;
            background:transparent;
            color:#6b7280;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        #clear_search:hover{
            background:#eef0f8;
            color:#111827;
        }

        #top_bar_alternative{
            display:flex;
            gap:8px;
            overflow-x: auto;
            width:100%;
            padding-bottom:2px;
            scrollbar-width:none;
        }

        #top_bar_alternative::-webkit-scrollbar{
            display:none;
        }

        #top_bar_alternative button{
            min-height:36px;
            display:inline-flex;
            align-items:center;
            gap:7px;
            white-space:nowrap;
            background-color:#f8fafc;
            border:solid 1px #e2e6f0;
            border-radius:999px;
            padding:0 14px;
            color:#374151;
            font-family:inherit;
            font-size:13px;
            font-weight:600;
            cursor:pointer;
            transition:background 0.16s, border-color 0.16s, color 0.16s;
        }

        #top_bar_alternative button.active{
            background-color: var(--primary-color);
            border-color:var(--primary-color);
            color:white;
        }

        #top_bar_alternative button:hover,
        #top_bar_alternative button:focus-visible{
            border-color:var(--primary-color);
            outline:none;
        }

    <script>
        const filterButtons = document.querySelectorAll("#top_bar_alternative button");
        const searchInput = document.getElementById("søksfelt");
        const clearSearch = document.getElementById("clear_search");

        const contentContainer = document.querySelector(".content_container");
        contentContainer.classList.add("active");

        filterButtons.forEach(button => {
            button.addEventListener("click", () => {
                filterButtons.forEach(otherButton => otherButton.classList.remove("active"));
                button.classList.add("active");
                
                const contDisp = document.querySelectorAll(`.contDisp`);
                contDisp.forEach(cont => cont.style.display = "none");
                function showCont(cont) {
                    cont.style.display = "flex";
                }

                if (button.classList.contains("active")) {
                    if (button.innerText === "Trening") {
                        showCont(document.querySelector(".content_container"));
                    } else if (button.innerText === "Studie") {
                        showCont(document.querySelector(".study_container"));
                    } else if (button.innerText === "Arbeid") {
                        showCont(document.querySelector(".work_container"));
                    } else if (button.innerText === "Vaner") {
                        showCont(document.querySelector(".habits_container"));
                    } else if (button.innerText === "Journal") {
                        showCont(document.querySelector(".journal_container"));
                    }
                }
            });
        });

        clearSearch.addEventListener("click", () => {
            searchInput.value = "";
            searchInput.focus();
        });
    </script>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabaseUrl = 'https://phvvbnmpujqyzqicdrrc.supabase.co'
        const supabaseKey = 'sb_publishable_owGo8PDUBRjA6l4Iq5RT0Q_N8w8Awhj'
        const supabase = createClient(supabaseUrl, supabaseKey)

        async function hentData() {              
            const { data, error } = await supabase 
                .from('bruker_data_trening')
                .select('user_id, dato, aktivitet, type, varighet, distanse, gj_snitt_puls, maks_puls, innsats, notat, xp')
                .order('dato', { ascending: false })

        const content_container = document.querySelector(".content_container");
        content_container.innerHTML = "";

        data.forEach(element => {
            const card = document.createElement("div");
            card.className = "content_card utforming";

            /*Funksjon som finner ukedag basert på dato*/
            const dato = new Date(element.dato);

            const ukedag = dato.toLocaleDateString("nb-NO", {
                weekday: "long"
            });


            /* Funksjon som beregner hastighet min/km */
            const hastighet = (element.varighet / element.distanse).toFixed(2);

            card.innerHTML = `

                <!-- HEADER -->
                <div class="top">

                    <div>
                        <p class="label">Dato</p>
                        <p class="value">${element.dato} • ${ukedag}</p>
                    </div>

                    <div class="badge">

                </div>


                <!-- HOVEDTALL -->
                <div class="highlight">

                    <div>

                        <p class="value">${element.distanse} km</p>
                    </div>

                    <div>
                        <p class="label">Tempo</p>

                    </div>

                    <div>
                        <p class="label">Varighet</p>
                        <p class="value">${element.varighet} min</p>
                    </div>

                </div>


                <!-- NOTAT -->
                <div>
                    <p class="note">
                        ${element.notat}
                    </p>
                </div>


                <!-- STATS -->
                <div class="stats">

                    <div>
                        <p class="label">Puls</p>
                        <p class="value">${element.gj_snitt_puls} / ${element.maks_puls}</p>
                    </div>

                    <div>
                        <p class="label">Innsats</p>
                        <p class="value">${element.innsats}/10</p>
                    </div>

                    <div>
                        <p class="label">XP</p>
                        <p class="value">${element.xp}</p>
                    </div>

            `
        content_container.appendChild(card);


        /* --- Legger til stil på kortene basert på informasjon --- */

        /* ====================== Henter data fra bruker_data_vaner ========================= */

        async function hentData_vaner() {              
            const { data, error } = await supabase 
                .from('bruker_data_vaner')
                .select('user_id, dato, vane, verdi, enhet, notat, xp')
                .order('dato', { ascending: false })

            const content_container = document.querySelector(".habits_container");

            data.forEach(element => {

                card.className = "content_card";

                /*Funksjon som finner ukedag basert på dato*/
                const dato = new Date(element.dato);

                const ukedag = dato.toLocaleDateString("nb-NO", {
                    weekday: "long"
                });

                card.innerHTML = `
                <div class="habit_header">

                    <div class="habit_meta">

                        <span class="habit_name">
                            ${element.vane}
                        </span>

                        <span class="habit_date">
                            ${ukedag} • ${element.dato}
                        </span>

                    </div>

                    <div class="habit_footer">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <i class="fa-solid fa-layer-group"></i>
                            <div>
                                <p class="work_duration_title">Verdi</p>
                            <div class="work_duration">
                                <span class="habit_number">${element.verdi}</span>
                                <small>${element.enhet || ""}</small>
                            </div>
                            </div>
                        </div>

                        <div class="work_xp">
                            <i class="fa-solid fa-bolt"></i>
                            <div>
                                <p class="work_duration_title">XP</p>
                                <p class="work_xp_value">+${element.xp || 0}</p>

                <div class="habit_note">

            `
                if(element.verdi == "true"){

        hentData_vaner()


        /* ====================== Henter data fra bruker_data_journal ========================= */

        async function hentData_journal() {              
            const { data, error } = await supabase 
                .from('bruker_data_journal')
                .select('user_id, dato, kategori, takknemlig_1, takknemlig_2, takknemlig_3, refleksjon, energi, rate, xp, tittel')
                .order('dato', { ascending: false })

            const content_container = document.querySelector(".journal_container");
            content_container.innerHTML = "";

            data.forEach(element => {
                const card = document.createElement("div");
                card.className = "content_card";

                /*Funksjon som finner ukedag basert på dato*/
                const dato = new Date(element.dato);

                const ukedag = dato.toLocaleDateString("nb-NO", {
                    weekday: "long"
                });

                card.innerHTML = `
                    <div class="card_header">
                        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <span class="journal_category">
                                <u class="journal_badge">${element.kategori}</u>
                                <u class="journal_date">${ukedag} • ${element.dato}</u>
                            </span>

                            <span class="journal_title">
                                <p>${element.tittel}</p>
                            </span>
                        </div>


                        <div class="work_focus" style="display:flex; flex:1;">
                        <div class="progress-container">
                            <svg viewBox="0 0 200 200">

                                <circle
                                    class="background"
                                    cx="100"
                                    cy="100"
                                    r="80">
                                </circle>

                                <circle
                                    class="progress"
                                    cx="100"
                                    cy="100"
                                    r="80">
                                </circle>
                            </svg>

                        <div class="content">
                            <small>Energi</small>
                            <div class="value" id="value">${element.energi || "-"}<u style="font-size: 0.8rem; margin-left: 2px; text-decoration: none; font-weight: lighter;">/10</u></div>
                        </div>
                        </div>
                        </div>

                        </div>
                        
                        <div class="journal_text">
                            ${element.refleksjon || "Ingen refleksjon skrevet"}
                        </div>
                    </div>
                
                <div style="display:flex; flex-direction:column; gap:8px;">
                    <p class="label">Takknemlig for</p>
                    <div class="great_list">
                        <p class="note">
                            1. ${element.takknemlig_1 || "-"}
                        </p>
                        <p class="note">
                            2. ${element.takknemlig_2 || "-"}
                        </p>
                        <p class="note">
                            3. ${element.takknemlig_3 || "-"}
                        </p>
                    </div>
                </div>

                <div class="journal_footer">

                    <div class="energy">
                        Se statisikk fra dagen 
                    </div>

                    <div class="work_xp">
                        <i class="fa-solid fa-bolt"></i>
                        <div>
                            <p class="work_duration_title">XP</p>
                            <p class="work_xp_value">+${element.xp || 0}</p>
                        </div>
                    </div>

                </div>
                `

                const verdi = element.energi || 0;
                const maks = 10;
                const prosent = verdi / maks;
                const radius = 80;
                const circumference = 2 * Math.PI * radius;

                // Hent progress-sirkelen i dette kortet
                const progressCircle = card.querySelector(".progress");
                progressCircle.style.strokeDasharray = circumference;
                const offset = circumference * (1 - prosent);
                progressCircle.style.strokeDashoffset = offset;

                /* -- Ny Seksjon -- */

                const journal = card.querySelector(".journal_text");

                card.addEventListener("click", () => {
                    journal.classList.toggle("BeskShow");
                });

                content_container.appendChild(card);
            });
        };
        hentData_journal()

                const radius = 80;
                const circumference = 2 * Math.PI * radius;

                // Hent progress-sirkelen i dette kortet
                const progressCircle = card.querySelector(".progress");

    </script>
