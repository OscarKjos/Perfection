<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">

    <!-- Robots: Tillat søkemotorer å indeksere -->
    <meta name="robots" content="index, follow">

    <!-- Ikoner for ulike enheter -->
    <link rel="icon" type="image/png" sizes="32x32" href="Bilder/ikoner/logo_webb.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="Bilder/ikoner/logo_webb.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="Bilder/ikoner/logo_light.png"> 

    <!-- PWA / mobil optimalisering -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="white">

    <!-- Google Search Console -->
    
    
    <!-- Tittel og beskrivelse (SEO) -->
    <title>Kvador</title>
    <meta name="description" content="Kvador er en app som hjelper deg å bli bedre hver dag. Med enkle verktøy for å sette mål, spore fremgang og få innsikt i dine vaner, gjør Kvador det lettere enn noen gang å nå dine mål og forbedre deg selv.">

    <style>
        #section_part{
            display:flex;
            flex-direction: column;
            gap:12px;
            position: relative;
            width:100%;
            overflow: hidden;
            padding:12px;
            box-sizing:border-box;
        }


         #search_top_bar{
            background-color: white;
            padding:12px;
            border-radius: 14px;
            display:flex;
            flex-direction: column;
            gap:12px;
            border:1px solid #e7eaf1;
            box-shadow:0 8px 24px rgba(17,24,39,0.06);
        }

        #search_relative{
            position: relative;
            width:100%;
            display:flex;
            align-items:center;
        }

        #search_top_bar input{
            height:44px;
            padding:0 42px 0 40px;
            background-color: #f6f8fb;
            border:#e7eaf1 solid 1px;
            border-radius: 14px 0px 0px 14px;
            width:100%;
            font-size: 16px;
            box-sizing: border-box;
            outline:none;
            transition:border-color 0.16s, box-shadow 0.16s, background 0.16s;
        }

        #search_top_bar input:focus{
            background:white;
            border-color:var(--primary-color);
            box-shadow:0 0 0 3px rgba(0,176,121,0.12);
        }

        .search-icon{
            position: absolute;
            top:50%;
            left:14px;
            transform: translateY(-50%);
            color:#6b7280;
            pointer-events:none;
        }

        #clear_search{
            position:absolute;
            right:8px;
            width:30px;
            height:30px;
            border:none;
            border-radius:8px;
            background:transparent;
            color:#6b7280;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        #clear_search:hover{
            background:#eef0f8;
            color:#111827;
        }

        #top_bar_alternative{
            display:flex;
            gap:8px;
            overflow-x: auto;
            width:100%;
            padding-bottom:2px;
            scrollbar-width:none;
        }

        #top_bar_alternative::-webkit-scrollbar{
            display:none;
        }

        #top_bar_alternative button{
            min-height:36px;
            display:inline-flex;
            align-items:center;
            gap:7px;
            white-space:nowrap;
            background-color:#f8fafc;
            border:solid 1px #e2e6f0;
            border-radius:999px;
            padding:0 14px;
            color:#374151;
            font-family:inherit;
            font-size:13px;
            font-weight:600;
            cursor:pointer;
            transition:background 0.16s, border-color 0.16s, color 0.16s;
        }

        #top_bar_alternative button.active{
            background-color: var(--primary-color);
            border-color:var(--primary-color);
            color:white;
        }

        #top_bar_alternative button:hover,
        #top_bar_alternative button:focus-visible{
            border-color:var(--primary-color);
            outline:none;
        }

        .nanobtn{
            padding:13.4px;
            border-radius:0px 10px 10px 0px;
            background-color: #f8fafc;
            border:solid 1px #e2e6f0;
            color:#374151;
            cursor:pointer;
            transition:background 0.16s, border-color 0.16s, color 0.16s;
        }
    </style>

</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
    </div>

    <section id="section_part">
        <div id="search_top_bar">
            <div style="display:flex; justify-content:space-between; align-items:center;">
            <div id="search_relative">
                <input id="søksfelt" type="search" placeholder="Søk i aktiviteter">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <button id="clear_search" type="button" aria-label="Tøm søkefelt">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <i id="filter_btn" class="fa-solid fa-table-list nanobtn"></i>
            <i id="layer_btn" class="fa-solid fa-layer-group nanobtn"></i>
            </div>
            
            <div id="top_bar_alternative" aria-label="Filtrer aktiviteter">
                <button type="button" class="active"><i class="fa-solid fa-route"></i>Trening</button>
                <button type="button"><i class="fa-solid fa-book"></i>Studie</button>
                <button type="button"><i class="fa-solid fa-chart-line"></i>Arbeid</button>
                <button type="button"><i class="fa-solid fa-bed"></i>Vaner</button>
                <button type="button"><i class="fa-solid fa-journal-whills"></i>Journal</button>
            </div>
        </div>
    </section>


<style>
        .contDisp{
            padding:12px;
            display: flex;
            flex-direction: column;
            gap:15px;
            margin-bottom:85px;
            display:none;
        }

        .contDisp.active{
            display:flex;
        }

        .content_card{
            background-color: var(--surface-color);
            border:1px solid #e8edf3;
            border-radius:22px;
            padding:20px 15px 20px 15px;
            display:flex;
            flex-direction:column;
            gap:18px;
            transition:.25s;
            box-shadow:
                0 8px 20px rgba(0,0,0,.04);
        }

        .content_card:hover{
            transform:translateY(-3px);

            box-shadow:
                0 14px 30px rgba(0,0,0,.08);
        }

        .utforming{
            background-image: url(Bilder/utforming.png);
            background-size: cover;
            background-position: top;
            width: 100%;
            overflow: hidden;
        }

        p{
            margin:0;
        }

        .label{
            font-size:10px;
            color:#7b8190;
            text-transform:uppercase;
            margin-bottom:2px;
        }

        .value{
            font-size:13px;
            font-weight:700;
            color:var(--text-color);
        }

        .top{
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .activity{
            display:flex;
            align-items:center;
            gap:8px;
        }

        .activity h2{
            margin:0;
            font-size:18px;
        }

        .badge{
            background:var(--primary-color);
            color: white;
            display:flex;
            align-items: center;
            gap:8px;

            padding: 9px 18px 9px 18px;
            border-radius:22px;

            font-size:13px;
            font-weight:700;
        }

        .iconStyle{
            width:22px;
            height:22px;
            border-radius:50%;
            color:var(--primary-color);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:1.1rem;
        }

        .icon_flex{
            display:flex;
            flex-direction: row;
            align-items:center;
            gap:8px;
        }

        .highlight{
            display:grid;
            grid-template-columns: 6fr 1fr 6fr 1fr 6fr;
            gap:10px;
        }

        .stats{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:33px;

            padding-top:15px;
            border-top:1px solid #eef1f6;
        }

        .note{
            color:#4b5563;
            font-size:13px;
            line-height:1.4;
        }


        /* -- Studie-card -- */

            .card_top{
                display:flex;
                justify-content:space-between;
                align-items:start;
            }

            .study_title{
                font-size:1.3rem;
                font-weight:700;
            }

            .study_date{
                color:#73808f;
                font-size:0.9rem;
            }

            .study_duration{
                font-size:2rem;
                font-weight:800;
                color:var(--primary-color);
            }

            .study_duration span{
                font-size:1rem;
                color:#73808f;
            }

            .meta_grid{
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:10px;
            }

            .meta{
                background:#f5f7fa;
                padding:10px 14px;
                border-radius:14px;
            }

            .meta_label{
                font-size:0.75rem;
                color:#7b8794;
            }

            .meta_value{
                margin-top:4px;
                font-weight:600;
            }

            .study_notes{
                color:#4b5563;
                font-size:0.8rem;
                line-height:1.4;
            }


            /* -- Journal-card -- */
            .journal_container{
                flex-direction:column;
                gap:18px;
                padding:16px;
                margin-bottom:90px;
            }

            .card_header{
                display:flex;
                flex-direction: column;
            }

            .journal_meta{
                display:flex;

                flex-direction:column;

                gap:8px;
            }

            .journal_category{
                font-weight:500;
                border-radius:999px;
                width:fit-content;
                font-size:1rem;
                display:flex;
                flex-direction: row;
                gap:10px;
                align-items:center;
                border-bottom: 1px solid #eef1f5;
                padding-bottom: 5px;
            }

            .journal_badge{
                background: var(--secondary_color);
                color: var(--primary-color);
                padding: 5px 10px;
                border-radius: 8px;
                font-size: 15px;
                font-weight: 700;
                text-decoration: none;
            }

            .journal_date{
                color:#7a8596;
                font-size:0.8rem;
                text-decoration: none;
                font-weight: lighter;
            }

            .journal_title{
                color:#010101;
                font-size:1.2rem;
                line-height:1.2;
                width:80%;
            }

            .journal_score{
                min-width:72px;
                aspect-ratio:1;
                border-radius:18px;
                display:flex;
                gap:5px;
                align-items:center;
                justify-content:center;
                flex-direction:row;
                font-weight:800;
            }

            .journal_score span{
                font-size:1.5rem;
                line-height:1;
            }

            .journal_score small{
                opacity:.8;
            }

            .journal_text{
                line-height:1.8;
                font-size: 13px;
                color:#273142;
                word-break:break-word;

                display: -webkit-box;
                -webkit-line-clamp: 4;  /* antall linjer */
                -webkit-box-orient: vertical;
                overflow: hidden;
                white-space: pre-line;
            }

            .journal_text.BeskShow{
                display: -webkit-box;
                -webkit-line-clamp: unset; /* antall linjer */
                -webkit-box-orient: vertical;
                overflow: visible;
            }

            .great_list{
                display:flex;
                flex-direction: row;
                justify-content: space-between;
            }

            .journal_footer{
                display:flex;
                justify-content:space-between;
                align-items:center;
                border-top:1px solid #eef1f5;
                padding-top:14px;
                font-size:0.92rem;
            }

            .energy{
                font-weight:600;
                color:var(--text-color);
            }

            .xp{
                color:#2fca87;

                font-weight:700;
            }


            /* -- Work-card -- */
            .work_container{
                flex-direction:column;

                gap:18px;

                padding:16px;

                margin-bottom:90px;
            }

            .work_header{
                display:flex;
                align-items:flex-start;
                justify-content: space-between;
            }

            .work_xp{
                display:flex;
                align-items: center;
                gap:5px;
            }

            .work_xp i{
                color:var(--text-color);
            }

            .work_xp div{
                display:flex;
                flex-direction: column;
                align-items: center;
            }

            .work_xp_value{
                font-size:0.9rem;
                font-weight:800;
                color:var(--text-color);
            }

            .work_meta{
                display:flex;

                flex-direction:column;

                gap:8px;
            }

            .work_title{
                font-weight:550;
                color:var(--text-color);

            }

            .work_category{
                width:fit-content;
                padding:8px 14px;
                background:var(--secondary_color);
                color:var(--primary-color);
                border-radius:999px;
                font-size:.9rem;
                font-weight:700;
            }

            .work_date{
                color:#7c8595;

                font-size:.95rem;
            }

            .work_duration span{
                font-size:0.9rem;
                font-weight:800;
                line-height:1;
            }

            .work_duration small{
                opacity:.8;
            }

            .work_duration_title{
                color:#6c717a;
                font-size:0.7rem;

            }

            .work_note{
                color:#283343;
                line-height:1.8;
                font-size:0.8rem;
                word-break:break-word;
                padding-top:10px;
                border-top: 1px solid #eef2f7;
            }

            .work_footer{
                display:flex;

                justify-content:space-between;

                align-items:center;

                border-top:1px solid #eef2f7;

                padding-top:14px;

                color:#7c8595;

                font-size:.92rem;
            }

            .progress-container{
                position:relative;
                width:90px;
                height:90px;
            }

            svg{
                width:100%;
                height:100%;
                transform:rotate(-90deg);
            }

            circle{
                fill:none;
                stroke-width:12;
            }

            .background{
                stroke:#e4e7eb;
            }

            .progress{
                stroke:var(--primary-color);
                stroke-linecap:round;
                transition:stroke-dashoffset .8s ease;
            }

            .content{
                position:absolute;
                inset:0;
                display:flex;
                flex-direction:column;
                justify-content:center;
                align-items:center;
            }

            .content small{
                font-weight:lighter;
                font-size:0.8rem;
                color:var(--text-color);
            }

            .work_focus{
                font-weight:600;
            }

            .work_progress{
                display:flex;
                align-items:center;
                gap:5px;
                font-weight:700;
                background-color: #f5f6fa;
                border-radius: 10px;
            }

            .work_progress p{
                font-size:.5rem;
                color:white;
                font-weight:600;
                margin-left:5px;

            }

            .work_progress_bar{
                width:40%;
                height:10px;
                background-color: var(--primary-color);
                border-radius: 10px;
            }


            /* -- Habits-card -- */
            .habits_container{
                flex-direction:column;
                gap:18px;
                padding:16px;
                margin-bottom:90px;
            }

            .habit_header{
                display:flex;
                flex-direction: column;
                gap:10px;
            }

            .habit_meta{
                display:flex;
                flex-direction:column;
                gap:8px;
            }

            .habit_name{
                font-size: 20px;
                font-weight: 700;
                color:var(--primary-color);
            }

            .habit_date{
                color:#7d8696;

                font-size:.95rem;
            }

            .habit_note{
                color:#283343;
                line-height:1.8;
                font-size:1rem;
                display:flex;
                flex-direction:row;
                gap:10px;
                align-items:center;
            }

            .habit_note_text{
                font-size:0.8rem;
                color:#283343;
                line-height:1.6;
                background-color: #eff2f5;
                padding:8px 12px;
                border-radius: 5px;
                word-break:break-word;
                width:100%;
            }

            .habit_footer{
                display:flex;
                gap:60px;
                align-items:center;
                border-top:1px solid #eef2f7;
                padding-top:5px;
            }

            .habit_status{
                font-weight:600;
            }

            .habit_xp{
                color:#2fca87;

                font-weight:700;
            }

            .tableGroup{
                display:none;
                flex-direction: column;
                width:100%;
                padding:12px;
                margin-bottom:85px;
                overflow-x:auto;
                scrollbar-width:thin;
            }

            .main_table{
                border-collapse:separate;
                border-spacing:0;
                background:white;
                border:1px solid #e8edf3;
                border-radius:14px;
                overflow:hidden;
                box-shadow:0 8px 24px rgba(17,24,39,0.06);
                font-size:13px;

                width: max-content;
                min-width: 100%;
                border-collapse: separate;
                border-spacing:7px;
                table-layout:auto;
            }

            .main_table thead{
                background:#f6f8fb;
            }

            .main_table th,
            .main_table td{
                padding:10px;
                text-align:left;
                border-bottom:1px solid #edf1f6;
                white-space:nowrap;
            }

            .main_table th{
                color:#667085;
                font-size:11px;
                font-weight:700;
                text-transform:uppercase;
            }

            .main_table td{
                color:#273142;
                font-weight:500;
            }

            .main_table tbody tr:hover{
                background:#f9fbfd;
            }

            .main_table tbody tr:last-child td{
                border-bottom:none;
            }

            .main_table td:last-child{
                color:#2fca87;
                font-weight:800;
            }

            #layer_btn{
                display:none;
            }

            .aktivitet_extra{
                border-radius: 10px;
            }

    /* -- Darkmode -- */
    @media (prefers-color-scheme: dark) {
        #search_top_bar {
            background-color: var(--surface-color);
            border-color: #202832;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
        }

        #search_top_bar input {
            background-color: #111820;
            border-color: #28323d;
            color: var(--text-color);
        }

        #search_top_bar input::placeholder {
            color: #7f8a98;
        }

        #search_top_bar input:focus {
            background-color: #151d26;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(6, 114, 68, 0.28);
        }

        .search-icon,
        #clear_search {
            color: #929ca9;
        }

        #clear_search:hover {
            background: #202a35;
            color: var(--text-color);
        }

        #top_bar_alternative button,
        .nanobtn {
            background-color: #121921;
            border-color: #293440;
            color: #c3cbd5;
        }

        #top_bar_alternative button:hover,
        #top_bar_alternative button:focus-visible,
        .nanobtn:hover {
            background-color: #19232d;
            border-color: var(--primary-color);
        }

        #top_bar_alternative button.active {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #ffffff;
        }

        .content_card {
            border-color: #202a34;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.3);
        }

        .utforming {
            background-image:
                linear-gradient(rgba(11, 15, 20, 0.94), rgba(11, 15, 20, 0.94)),
                url('Bilder/utforming2.png');
        }

        .content_card:hover {
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.4);
        }

        .label,
        .study_date,
        .study_duration span,
        .meta_label,
        .journal_date,
        .work_date,
        .work_duration_title,
        .work_footer,
        .habit_date {
            color: #929dab;
        }

        .note,
        .study_notes,
        .journal_title,
        .journal_text,
        .work_note,
        .habit_note,
        .habit_note_text {
            color: #d6dce4;
        }

        .meta,
        .habit_note_text,
        .work_progress {
            background-color: #141c24;
        }

        .stats,
        .journal_category,
        .journal_footer,
        .work_note,
        .work_footer,
        .habit_footer {
            border-color: #25303b;
        }

        .background {
            stroke: #29333e;
        }

        .highlight > div[style*="background-color"] {
            background-color: #2a3540 !important;
        }

        .main_table {
            background: var(--surface-color);
            border-color: #202a34;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3);
        }

        .main_table thead {
            background: #131b23;
        }

        .main_table th,
        .main_table td {
            border-bottom-color: #222d38;
        }

        .main_table th {
            color: #96a1af;
        }

        .main_table td {
            color: #d5dbe3;
        }

        .main_table tbody tr:hover {
            background: #151e27;
        }
    }
</style>

<main class="study_container contDisp"></main>
    <main class="study_table tableGroup contDisp">
        <table class="main_table">
            <thead>
                <tr>
                    <th>Dato</th>
                    <th>Fagområde</th>
                    <th>Studiemetode</th>
                    <th>Varighet</th>

        </table>

    <script>
        const filter = document.getElementById("filter_btn");
        const layer = document.getElementById("layer_btn");

        if (localStorage.getItem("filter") === "true") {
            document.querySelectorAll(".contDisp").forEach(cont => {
                cont.style.display = "none";
            });

            document.querySelector(".content_table").style.display = "flex";
            layer.style.display = "flex";
            filter.style.display = "none";
        }

        filter.addEventListener("click", () => {
            localStorage.setItem("filter", "true");

            document.querySelectorAll(".contDisp").forEach(cont => {
                cont.style.display = "none";
            });

            document.querySelector(".content_table").style.display = "flex";

            layer.style.display = "flex";
            filter.style.display = "none";
        })

        layer.addEventListener("click", () => {
            localStorage.setItem("filter", "false");

            document.querySelectorAll(".contDisp").forEach(cont => {
                cont.style.display = "none";
            });

            document.querySelector(".content_container").style.display = "flex";

            layer.style.display = "none";
            filter.style.display = "flex";
        })
    </script>


    <script>
        const filterButtons = document.querySelectorAll("#top_bar_alternative button");
        const searchInput = document.getElementById("søksfelt");
        const clearSearch = document.getElementById("clear_search");

        const contentContainer = document.querySelector(".content_container");
        contentContainer.classList.add("active");

        filterButtons.forEach(button => {
            button.addEventListener("click", () => {
                filterButtons.forEach(otherButton => otherButton.classList.remove("active"));
                button.classList.add("active");
                
                const contDisp = document.querySelectorAll(`.contDisp`);
                contDisp.forEach(cont => cont.style.display = "none");
                function showCont(cont) {
                    cont.style.display = "flex";
                }

                if (button.classList.contains("active")) {
                    if (button.innerText === "Trening") {
                        if (localStorage.getItem("filter") === "true") {
                            showCont(document.querySelector(".content_table"));
                        }
                        else {
                            showCont(document.querySelector(".content_container"));
                        }
                    } else if (button.innerText === "Studie") {
                        if (localStorage.getItem("filter") === "true") {
                            showCont(document.querySelector(".study_table"));
                        }
                        else {
                            showCont(document.querySelector(".study_container"));
                        }
                    } else if (button.innerText === "Arbeid") {
                        
                        if (localStorage.getItem("filter") === "true") {
                            showCont(document.querySelector(".work_table"));
                        }
                        else {
                            showCont(document.querySelector(".work_container"));
                        }
                    } else if (button.innerText === "Vaner") {

                        if (localStorage.getItem("filter") === "true") {
                            showCont(document.querySelector(".habits_table"));
                        }
                        else {
                            showCont(document.querySelector(".habits_container"));
                        }
                    } else if (button.innerText === "Journal") {

                        if (localStorage.getItem("filter") === "true") {
                            showCont(document.querySelector(".journal_table"));
                        }
                        else {
                            showCont(document.querySelector(".journal_container"));
                        }
                    }
                }
            });
        });

        clearSearch.addEventListener("click", () => {
            searchInput.value = "";
            searchInput.focus();
        });
    </script>

                            <span class="journal_title">
                                <p>${element.tittel}</p>
                            </span>
                        </div>


                        <div class="work_focus" style="display:flex; flex:1;">
                        <div class="progress-container">
                            <svg viewBox="0 0 200 200">

                                <circle
                                    class="background"
                                    cx="100"
                                    cy="100"
                                    r="80">
                                </circle>

                                <circle
                                    class="progress"
                                    cx="100"
                                    cy="100"
                                    r="80">
                                </circle>
                            </svg>

                        <div class="content">
                            <small>Energi</small>
                            <div class="value" id="value">${element.energi || "-"}<u style="font-size: 0.8rem; margin-left: 2px; text-decoration: none; font-weight: lighter;">/10</u></div>
                        </div>
                        </div>
                        </div>

                        </div>
                        
                        <div class="journal_text">
                            ${element.refleksjon || "Ingen refleksjon skrevet"}
                        </div>
                    </div>
                
                <div style="display:flex; flex-direction:column; gap:8px;">
                    <p class="label">Takknemlig for</p>
                    <div class="great_list">
                        <p class="note">
                            1. ${element.takknemlig_1 || "-"}
                        </p>
                        <p class="note">
                            2. ${element.takknemlig_2 || "-"}
                        </p>
                        <p class="note">
                            3. ${element.takknemlig_3 || "-"}
                        </p>
                    </div>
                </div>

                <div class="journal_footer">

                    <div class="energy">
                        Se statisikk fra dagen 
                    </div>

                    <div class="work_xp">
                        <i class="fa-solid fa-bolt"></i>
                        <div>
                            <p class="work_duration_title">XP</p>
                            <p class="work_xp_value">+${element.xp || 0}</p>
                        </div>
                    </div>

                </div>
                `

                const verdi = element.energi || 0;
                const maks = 10;
                const prosent = verdi / maks;
                const radius = 80;
                const circumference = 2 * Math.PI * radius;

                // Hent progress-sirkelen i dette kortet
                const progressCircle = card.querySelector(".progress");
                progressCircle.style.strokeDasharray = circumference;
                const offset = circumference * (1 - prosent);
                progressCircle.style.strokeDashoffset = offset;

                /* -- Ny Seksjon -- */

                const journal = card.querySelector(".journal_text");

                card.addEventListener("click", () => {
                    journal.classList.toggle("BeskShow");
                });

                content_container.appendChild(card);


                /* --- Danner tabell-struktur for alternativ visning --- */

                const dynamic = document.querySelector(".dynamic_journal_table");

                const row = document.createElement("tr");
                row.innerHTML = `
                        <td class="nameDate">${element.dato}</td>
                        <td>${element.kategori}</td>
                        <td>${element.tittel}</td>
                        <td>${element.energi}</td>
                        <td>${element.takknemlig_1}</td>
                        <td>${element.takknemlig_2}</td>
                        <td>${element.takknemlig_3}</td>
                        <td>${element.xp}</td>
                `;
                dynamic.appendChild(row);

                if (element.dato == new Date().toISOString().split("T")[0]) {
                    const nameDate = row.querySelector(".nameDate");
                    nameDate.innerHTML = "Today";
                }
            });
        };
        hentData_journal()


        /* ====================== Henter data fra bruker_data_produktvitet ========================= */

        async function hentData_produktvitet() {              
            const { data, error } = await supabase 
                .from('bruker_data_produktivitet')
                .select('user_id, dato, fokus, varighet, kategori, notat, fremgang, xp, tittel')
                .order('dato', { ascending: false })

            const content_container = document.querySelector(".work_container");
            content_container.innerHTML = "";

            data.forEach(element => {
                const card = document.createElement("div");
                card.className = "content_card utforming";

                /*Funksjon som finner ukedag basert på dato*/
                const dato = new Date(element.dato);

                const ukedag = dato.toLocaleDateString("nb-NO", {
                    weekday: "long"
                });

                card.innerHTML = `
                <div class="work_meta">

                        <div style="display:flex; align-items:center; gap:10px;">
                        <span class="work_category">
                            ${element.kategori}
                        </span>
                            <p class="work_title">${element.tittel}</p>
                        </div>

                        <span class="work_date">
                            ${ukedag} • ${element.dato}
                        </span>

                    </div>

                <div class="work_header">
                    <div class="work_focus" style="display:flex; flex:1;">
                        <div class="progress-container">
                            <svg viewBox="0 0 200 200">

                                <circle
                                    class="background"
                                    cx="100"
                                    cy="100"
                                    r="80">
                                </circle>

                                <circle
                                    class="progress"
                                    cx="100"
                                    cy="100"
                                    r="80">
                                </circle>
                            </svg>

                            <div class="content">
                                <small>Fokus</small>
                                <div class="value" id="value">${element.fokus || "-"}<u style="font-size: 0.8rem; margin-left: 2px; text-decoration: none; font-weight: lighter;">/10</u></div>
                            </div>
                        </div>
                    </div>

                <div style="display:flex; flex-direction:column; gap:15px; flex:2; color:var(--text-color);">
                <div style="display:flex; flex-direction:row; gap:20px;">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <i class="fa-regular fa-clock"></i>
                        <div>
                            <p class="work_duration_title">Varighet</p>
                        <div class="work_duration">
                            <span>${element.varighet}</span>
                            <small>min</small>
                        </div>
                        </div>
                    </div>

                    <div class="work_xp">
                        <i class="fa-solid fa-bolt"></i>
                        <div>
                            <p class="work_duration_title">XP</p>
                            <p class="work_xp_value">+${element.xp || 0}</p>
                        </div>
                    </div>
                </div>
                
                    <div>
                    <p style="margin-bottom: 5px;" class="work_duration_title">Fremgang: </p>
                    <div class="work_progress">
                        <div class="work_progress_bar">
                        </div>
                    </div>
                    <div>
                </div>

            </div>

                <div class="work_note">
                    ${element.notat}
                </div>
            `

                if (element.notat === "") {
                    card.querySelector(".work_note").style.display = "none";
                }

                const work_progress_bar = card.querySelector(".work_progress_bar");
                work_progress_bar.style.width = `${element.fremgang || 0}0%`;


                const verdi = element.fokus || 0;
                const maks = 10;
                const prosent = verdi / maks;
                const radius = 80;
                const circumference = 2 * Math.PI * radius;

                // Hent progress-sirkelen i dette kortet
                const progressCircle = card.querySelector(".progress");
                progressCircle.style.strokeDasharray = circumference;
                const offset = circumference * (1 - prosent);
                progressCircle.style.strokeDashoffset = offset;

                content_container.appendChild(card);


                /* --- Danner tabell-struktur for alternativ visning --- */

                const dynamic = document.querySelector(".dynamic_work_table");

                const row = document.createElement("tr");
                row.innerHTML = `
                        <td class="nameDate">${element.dato}</td>
                        <td class="aktivitet_extra">${element.kategori}</td>
                        <td>${element.tittel}</td>
                        <td>${element.varighet}</td>
                        <td>${element.fremgang}</td>
                        <td>${element.fokus}</td>
                        <td>${element.xp}</td>
                `;

                if (element.dato == new Date().toISOString().split("T")[0]) {
                    const nameDate = row.querySelector(".nameDate");
                    nameDate.innerHTML = "Today";
                }

                 function changeColorOfProductivity(aktivitet_value, bakgrunnsfarge, textfarge) {
                    if (element.kategori == aktivitet_value) {
                        const aktivitet_extra = row.querySelector(".aktivitet_extra");
                        aktivitet_extra.style.backgroundColor = bakgrunnsfarge;
                        aktivitet_extra.style.color = textfarge;
                    }
                }
                changeColorOfProductivity("Kode / Bygg", "#1E1E1E", "white");      // Alternativ farge: #b9d158
                changeColorOfProductivity("Lesing", "#F2F2F2", "black");           // Alternativ farge: #d15858
                changeColorOfProductivity("Språk", "#666666", "white");            // Alternativ farge: #FF9800
                changeColorOfProductivity("Dyp fokus", "#2F2F2F", "white");        // Alternativ farge: #6A1B9A
                changeColorOfProductivity("Planlegging", "#B8B8B8", "black");      // Alternativ farge: #009688
                changeColorOfProductivity("Skriving", "#4A4A4A", "white");         // Alternativ farge: #795548
                changeColorOfProductivity("Prosjekt", "#D8D8D8", "black");         // Alternativ farge: #E91E63
                changeColorOfProductivity("Video / Kurs", "#808080", "white");     // Alternativ farge: #F44336
                changeColorOfProductivity("Instrument", "#FFFFFF", "black");       // Alternativ farge: #FFC107
                changeColorOfProductivity("Kreativt", "#989898", "black");         // Alternativ farge: #9C27B0
                changeColorOfProductivity("Research", "#3B3B3B", "white");         // Alternativ farge: #2196F3

                dynamic.appendChild(row);
            });

            // Loading Screen
            setTimeout(() => {
                document.getElementById("loader")?.classList.add("hidden");
            }, 200);

        };
        hentData_produktvitet()

    </script>
