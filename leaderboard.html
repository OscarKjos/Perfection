<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Ekstern CSS for global stil og ikoner -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">

    <!-- Robots: Tillat søkemotorer å indeksere -->
    <meta name="robots" content="index, follow">

    <!-- Ikoner for ulike enheter -->
    <link rel="icon" type="image/png" sizes="32x32" href="Bilder/ikoner/logo_webb.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="Bilder/ikoner/logo_webb.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="Bilder/ikoner/logo_light.png"> 

    <!-- PWA / mobil optimalisering -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="white">

    <!-- Google Search Console -->
    
    
    <!-- Tittel og beskrivelse (SEO) -->
    <title>Kvador</title>
    <meta name="description" content="Kvador er en app som hjelper deg å bli bedre hver dag. Med enkle verktøy for å sette mål, spore fremgang og få innsikt i dine vaner, gjør Kvador det lettere enn noen gang å nå dine mål og forbedre deg selv.">

</head>
<body>
    <style>

        .table {
            width: min(100% - 24px, 900px);
            margin: 0px auto 90px;
            overflow-x: auto;
            padding: 4px;
        }

        .main_table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: var(--surface-color);
            border: 1px solid #e8edf3;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(17, 24, 39, 0.06);
            overflow: hidden;
        }

        .main_table th,
        .main_table td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #edf1f6;
            white-space: nowrap;
        }

        .main_table thead {
            background: #f6f8fb;
        }

        .main_table th {
            color: #667085;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .main_table td {
            color: #273142;
            font-weight: 500;
        }

        .main_table tbody tr:hover {
            background: #f9fbfd;
        }

        .main_table tbody tr:last-child td {
            border-bottom: none;
        }

        .main_table td:first-child {
            color: var(--primary-color);
            font-weight: 800;
        }

        .main_table td:nth-child(3),
        .main_table td:nth-child(4) {
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .table {
                width: calc(100% - 16px);
                margin-top: 8px;
            }

            .main_table th,
            .main_table td {
                padding: 12px;
            }
        }
    </style>

    <style>

        #section_part{
            display:flex;
            flex-direction: column;
            gap:12px;
            position: relative;
            width:100%;
            overflow: hidden;
            padding:12px;
            box-sizing:border-box;
            height: fit-content;
        }


         #search_top_bar{
            background-color: var(--surface-color);
            padding:12px;
            border-radius: 14px;
            display:flex;
            flex-direction: column;
            gap:12px;
            border:1px solid #e7eaf1;
            box-shadow:0 8px 24px rgba(17,24,39,0.06);
        }

        #search_relative{
            position: relative;
            width:100%;
            display:flex;
            align-items:center;
        }

        #search_top_bar input{
            height:44px;
            padding:0 42px 0 40px;
            background-color: var(--bg-color);
            border:#e7eaf1 solid 1px;
            border-radius: 14px;
            width:100%;
            font-size: 16px;
            box-sizing: border-box;
            outline:none;
            transition:border-color 0.16s, box-shadow 0.16s, background 0.16s;
        }

        #search_top_bar input:focus{
            background:white;
            border-color:var(--primary-color);
            box-shadow:0 0 0 3px rgba(0,176,121,0.12);
        }

        .search-icon{
            position: absolute;
            top:50%;
            left:14px;
            transform: translateY(-50%);
            color:#6b7280;
            pointer-events:none;
        }

        #clear_search{
            position:absolute;
            right:8px;
            width:30px;
            height:30px;
            border:none;
            border-radius:8px;
            background:transparent;
            color:#6b7280;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        #clear_search:hover{
            background:#eef0f8;
            color:#111827;
        }
    </style>

    <section id="section_part">
        <div id="search_top_bar">
            <div id="search_relative">
                <input id="søksfelt" type="search" placeholder="Søk etter brukere">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <button id="clear_search" type="button" aria-label="Tøm søkefelt">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>
    </section>

    <main class="table">
        <table class="main_table">
            <thead>
                <tr>
                    <th>Place</th>
                    <th>Navn</th>
                    <th>XP</th>
                    <th>Level</th>
                </tr>
            </thead>
            <tbody class="tableBody">
                <!-- Her kommer tabellinnholdet (importert fra supabase) -->
            </tbody>
        </table>
    </main>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabaseUrl = 'https://phvvbnmpujqyzqicdrrc.supabase.co'
        const supabaseKey = 'sb_publishable_owGo8PDUBRjA6l4Iq5RT0Q_N8w8Awhj'
        const supabase = createClient(supabaseUrl, supabaseKey)

        async function updateLeaderboard() {              
            const { data, error } = await supabase 
                .from('public_leaderboard')
                .select('navn, total_xp')
                .limit(100)
                .order('total_xp', { ascending: false });
            
            const tableBody = document.querySelector('.tableBody');

            if (error) {
                console.error(error);
            } 
            
            else {
                data.forEach((user, index) => {
                    const row = document.createElement('tr');

                    /* Formel for å beregne level */
                    const level = (Math.floor((user.total_xp / 100) ** (1/1.6)))+1

                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${user.navn}</td>
                        <td>${user.total_xp}</td>
                        <td>${level}</td>
                    `;
                    tableBody.appendChild(row);

                    if (user.navn === localStorage.getItem("navn")) {
                        row.classList.add('current_user');
                        row.style.backgroundColor = 'var(--secondary_color)';
                    }
                });

                /* --- Søkefunksjonalitet --- */
                const søksfelt = document.getElementById('søksfelt');
                søksfelt.addEventListener('input', () => {
                    const searchTerm = søksfelt.value.toLowerCase();
                    const rows = document.querySelectorAll('tbody tr');
                    rows.forEach(row => {
                        const navn = row.querySelector('td:nth-child(2)').textContent.toLowerCase();
                        if (navn.includes(searchTerm)) {
                            row.style.display = 'table-row';
                        } else {
                            row.style.display = 'none';
                        }
                    });
                });
            }

            
        };
        updateLeaderboard();
    </script>

    <script src="navigator.js" defer></script>
    <script type="module" src="../progress.js"></script>
</body>
</html>
