<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Ekstern CSS for global stil og ikoner -->
    <script src="global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">

    <!-- Robots: Tillat søkemotorer å indeksere -->
    <meta name="robots" content="index, follow">

    <!-- Ikoner for ulike enheter -->
    <link rel="icon" type="image/png" sizes="32x32" href="Bilder/ikoner/logo_webb.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="Bilder/ikoner/logo_webb.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="Bilder/ikoner/logo_light.png"> 

    <!-- PWA / mobil optimalisering -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="white">

    <!-- Google Search Console -->
    
    
    <!-- Tittel og beskrivelse (SEO) -->
    <title>Kvador</title>
    <meta name="description" content="Kvador er en app som hjelper deg å bli bedre hver dag. Med enkle verktøy for å sette mål, spore fremgang og få innsikt i dine vaner, gjør Kvador det lettere enn noen gang å nå dine mål og forbedre deg selv.">

</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
    </div>

    <style>
        .table {
            width: min(100% - 24px, 900px);
            margin: 0px auto 90px;
            overflow-x: auto;
            padding: 4px;
        }

        .main_table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: var(--surface-color);
            border: 1px solid #e8edf3;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(17, 24, 39, 0.06);
            overflow: hidden;
        }

        .main_table th,
        .main_table td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #edf1f6;
            white-space: nowrap;
        }

        .main_table thead {
            background: #f6f8fb;
        }

        .main_table th {
            color: #667085;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .main_table td {
            color: #273142;
            font-weight: 500;
        }

        .main_table tbody tr:hover {
            background: #f9fbfd;
        }

        .main_table tbody tr:last-child td {
            border-bottom: none;
        }

        .main_table td:first-child {
            color: var(--primary-color);
            font-weight: 800;
        }

        .main_table td:nth-child(3),
        .main_table td:nth-child(4) {
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .table {
                width: calc(100% - 16px);
                margin-top: 8px;
            }

            .main_table th,
            .main_table td {
                padding: 12px;
            }
        }
    </style>

    <style>

        #section_part{
            display:flex;
            flex-direction: column;
            gap:12px;
            position: relative;
            width:100%;
            overflow: hidden;
            padding:12px;
            box-sizing:border-box;
            height: fit-content;
        }


         #search_top_bar{
            background-color: var(--surface-color);
            padding:12px;
            border-radius: 14px;
            display:flex;
            flex-direction: column;
            gap:12px;
            border:1px solid #e7eaf1;
            box-shadow:0 8px 24px rgba(17,24,39,0.06);
        }

        #search_relative{
            position: relative;
            width:100%;
            display:flex;
            align-items:center;
        }

        #search_top_bar input{
            height:44px;
            padding:0 42px 0 40px;
            background-color: var(--bg-color);
            border:#e7eaf1 solid 1px;
            border-radius: 14px;
            width:100%;
            font-size: 16px;
            box-sizing: border-box;
            outline:none;
            transition:border-color 0.16s, box-shadow 0.16s, background 0.16s;
        }

        #search_top_bar input:focus{
            background:white;
            border-color:var(--primary-color);
            box-shadow:0 0 0 3px rgba(0,176,121,0.12);
        }

        .search-icon{
            position: absolute;
            top:50%;
            left:14px;
            transform: translateY(-50%);
            color:#6b7280;
            pointer-events:none;
        }

        #clear_search{
            position:absolute;
            right:8px;
            width:30px;
            height:30px;
            border:none;
            border-radius:8px;
            background:transparent;
            color:#6b7280;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        #clear_search:hover{
            background:#eef0f8;
            color:#111827;
        }

        @media (prefers-color-scheme: dark) {
            #search_top_bar {
                background-color: var(--surface-color);
                border-color: #202832;
                box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
            }

            #search_top_bar input {
                background-color: #111820;
                border-color: #28323d;
                color: var(--text-color);
                caret-color: var(--primary-color);
            }

            #search_top_bar input::placeholder {
                color: #7f8a98;
            }

            #search_top_bar input:focus {
                background-color: #151d26;
                border-color: var(--primary-color);
                box-shadow: 0 0 0 3px rgba(6, 114, 68, 0.28);
            }

            .search-icon,
            #clear_search {
                color: #929ca9;
            }

            #clear_search:hover {
                background: #202a35;
                color: var(--text-color);
            }

            .main_table {
                background: var(--surface-color);
                border-color: #202a34;
                box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3);
            }

            .main_table thead {
                background: #131b23;
            }

            .main_table th,
            .main_table td {
                border-bottom-color: #222d38;
            }

            .main_table th {
                color: #96a1af;
            }

            .main_table td {
                color: #d5dbe3;
            }

            .main_table tbody tr {
                transition: background-color 0.16s ease;
            }

            .main_table tbody tr:hover {
                background: #151e27;
            }

            .main_table tbody tr.current_user,
            .main_table tbody tr.current_user:hover {
                background-color: black !important;
            }
        }
    </style>

    <section id="section_part">
        <div id="search_top_bar">
            <div id="search_relative">
                <input id="søksfelt" type="search" placeholder="Søk etter brukere">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <button id="clear_search" type="button" aria-label="Tøm søkefelt">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>

        <section class="leaderboard_controls" aria-labelledby="leaderboard_view_title">
            <div class="leaderboard_controls_heading">
                <section class="visibility_switch" role="tablist" aria-label="Velg toppliste">
                    <button id="get_private" class="visibility_btn active" data-value="private" role="tab" aria-selected="true">
                        <i class="fa-solid fa-user-shield" aria-hidden="true"></i><span>Privat</span>
                    </button>
                    <button id="get_public" class="visibility_btn" data-value="public" role="tab" aria-selected="false">
                        <i class="fa-solid fa-earth-europe" aria-hidden="true"></i><span>Offentlig</span>
                    </button>
                </section>
            </div>
            <div class="leaderboard_note" aria-live="polite">
                <span class="leaderboard_note_icon" aria-hidden="true"><i class="fa-solid fa-circle-info"></i></span>
                <small id="private_note">Denne topplisten bruker simulerte deltakere, slik at du kan konkurrere helt privat.</small>
                <small id="public_note">Denne topplisten viser ekte brukere og deres delte resultater.</small>
            </div>
        </section>
    </section>

    <style>
        .leaderboard_controls { display:flex; flex-direction:column; gap:16px; padding:20px; background:var(--surface-color); border:1px solid #e7eaf1; border-radius:16px; box-shadow:0 8px 24px rgba(17,24,39,.06); }
        .leaderboard_controls_heading { display:flex; align-items:center; justify-content:space-between; gap:20px; }
        .leaderboard_eyebrow { display:block; margin-bottom:4px; color:var(--primary-color); font-size:.7rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
        .leaderboard_controls h2 { margin:0; color:var(--text-color); font-size:clamp(1.05rem,3vw,1.25rem); line-height:1.25; }
        .visibility_switch { display:flex; width:fit-content; padding:4px; gap:4px; background:#eef2f4; border:1px solid #e2e8ec; border-radius:13px; }
        
        .visibility_btn {
            min-height:25px; 
            border:0; 
            background:transparent; 
            padding:0 16px; 
            border-radius:9px; 
            font-family:inherit; 
            font-size:.72rem;
            font-weight:700;
            color:#66727d;
            cursor:pointer;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:8px;
            transition:color .18s,background-color .18s,box-shadow .18s; 
        }

        .visibility_btn:hover { color:#26313b; background:rgba(255,255,255,.55); }
        .visibility_btn:focus-visible { outline:3px solid rgba(0,176,121,.2); outline-offset:2px; }
        .visibility_btn.active { background:#fff; color:var(--primary-color); box-shadow:0 2px 8px rgba(17,24,39,.1); }
        .leaderboard_note { display:flex; align-items:center; gap:10px; min-height:42px; padding:10px 12px; box-sizing:border-box; color:#55616d; background:rgba(0,176,121,.07); border:1px solid rgba(0,176,121,.14); border-radius:11px; }
        
        .leaderboard_note_icon { 
            width:28px;
            height:28px;
            flex:0 0 28px;
            display:grid;
            place-items:center;
            color:var(--primary-color);
            border-radius:8px; 
        }

        .leaderboard_note small { font-size:.78rem; font-weight:500; line-height:1.45; }

        #public_table{
            display:none;
        }

        #public_note{
            display:none;
        }

        @media (max-width:600px) {
            .leaderboard_controls { padding:16px; }
            .leaderboard_controls_heading { align-items:stretch; flex-direction:column; gap:14px; }
            .visibility_switch { width:100%; box-sizing:border-box; }
            .visibility_btn { flex:1; padding:0 10px; }
        }

        @media (prefers-color-scheme:dark) {
            .leaderboard_controls { border-color:#202832; box-shadow:0 10px 28px rgba(0,0,0,.28); }
            .visibility_switch { background:#111820; border-color:#28323d; }
            .visibility_btn { color:#929ca9; }
            .visibility_btn:hover { color:#d5dbe3; background:#1a232d; }
            .visibility_btn.active { color:#62d5aa; background:#202a35; box-shadow:0 2px 8px rgba(0,0,0,.3); }
            .leaderboard_note { 
                color:#abb5c1;
                background:rgba(0,176,121,.1);
                border-color:rgba(0,176,121,.2); 
            }
            .leaderboard_note_icon { background:#17232a; }
        }
    </style>

    <main class="table" id="public_table">
        <table class="main_table">
            <thead>
                <tr>
                    <th>Place</th>
                    <th>Navn</th>
                    <th>XP</th>
                    <th>Level</th>
                </tr>
            </thead>
            <tbody class="tableBody">
                <!-- Her kommer tabellinnholdet (importert fra supabase) -->
            </tbody>
        </table>
    </main>

    <main class="table" id="privat_table">
        <table class="main_table">
            <thead>
                <tr>
                    <th>Place</th>
                    <th>Navn</th>
                    <th>XP</th>
                    <th>Level</th>
                </tr>
            </thead>
            <tbody class="computerTable">
                <!-- Her kommer tabellinnholdet (importert fra supabase) -->
            </tbody>
        </table>
    </main>

    <script>
        // Skifter mellom privat og public tabeller
        const getPrivate = document.querySelector('#get_private');
        const getPublic = document.querySelector('#get_public');

        const public_table = document.querySelector('#public_table');
        const privat_table = document.querySelector('#privat_table');

        const private_note = document.querySelector('#private_note');
        const public_note = document.querySelector('#public_note');

        getPrivate.addEventListener('click', () => {
            privat_table.style.display = 'block';
            public_table.style.display = 'none';
            private_note.style.display = 'block';
            public_note.style.display = 'none';
            getPrivate.classList.add('active');
            getPublic.classList.remove('active');
            getPrivate.setAttribute('aria-selected', 'true');
            getPublic.setAttribute('aria-selected', 'false');
        });

        getPublic.addEventListener('click', () => {
            public_table.style.display = 'block';
            privat_table.style.display = 'none';
            public_note.style.display = 'block';
            private_note.style.display = 'none';
            getPublic.classList.add('active');
            getPrivate.classList.remove('active');
            getPublic.setAttribute('aria-selected', 'true');
            getPrivate.setAttribute('aria-selected', 'false');
        });

        // Lager privat tabell med programmerte robotter
        const computerTable = document.querySelector('.computerTable');

        for (let i = 0; i < 10; i++) {
            const row = document.createElement('tr');

            const brukere = [
                { navn: "Jens Larsen", xp: Number(localStorage.getItem("xp_bruker1")) || 0 },
                { navn: "Ola Nordmann", xp: Number(localStorage.getItem("xp_bruker2")) || 0 },
                { navn: "Kari Hansen", xp: Number(localStorage.getItem("xp_bruker3")) || 0 },
                { navn: "Lars Pettersen", xp: Number(localStorage.getItem("xp_bruker4")) || 0 },
                { navn: "Ingrid Bakke", xp: Number(localStorage.getItem("xp_bruker5")) || 0 },
                { navn: "Sofie Berg", xp: Number(localStorage.getItem("xp_bruker6")) || 0 },
                { navn: "Henrik Olsen", xp: Number(localStorage.getItem("xp_bruker7")) || 0 },
                { navn: "Nora Dahl", xp: Number(localStorage.getItem("xp_bruker8")) || 0 },
                { navn: "Emil Lie", xp: Number(localStorage.getItem("xp_bruker9")) || 0 },
                { navn: localStorage.getItem("navn") || "Deg", xp: Number(localStorage.getItem("xp_point")) || 0 }
            ];

            brukere.sort((a, b) => b.xp - a.xp);

            let level = (Math.floor((brukere[i].xp / 100) ** (1/1.6)))+1

            if (brukere[i].xp < 0) {
                level = 0
            }

            function randomXP(bruker) {
                let current_xp = Number(localStorage.getItem(bruker));
                current_xp += Math.round(Math.random() * 10);
                current_xp -= Math.round(Math.random() * 8);

                localStorage.setItem(bruker, current_xp);
            };
            randomXP("xp_bruker1");
            randomXP("xp_bruker2");
            randomXP("xp_bruker3");
            randomXP("xp_bruker4");
            randomXP("xp_bruker5");
            randomXP("xp_bruker6");
            randomXP("xp_bruker7");
            randomXP("xp_bruker8");
            randomXP("xp_bruker9");

            row.innerHTML = `
                <td>${i + 1}</td>
                <td>${brukere[i].navn}</td>
                <td>${Math.round(brukere[i].xp)}</td>
                <td>${level}</td>
            `;

            if (brukere[i].navn === localStorage.getItem("navn")) {
                row.classList.add('current_user');
                row.style.backgroundColor = 'var(--secondary_color)';
            }

            computerTable.appendChild(row);
        }
    </script>



    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabaseUrl = 'https://phvvbnmpujqyzqicdrrc.supabase.co'
        const supabaseKey = 'sb_publishable_owGo8PDUBRjA6l4Iq5RT0Q_N8w8Awhj'
        const supabase = createClient(supabaseUrl, supabaseKey)

        async function updateLeaderboard() {              
            const { data, error } = await supabase 
                .from('public_leaderboard')
                .select('navn, total_xp')
                .limit(100)
                .order('total_xp', { ascending: false });
            
            const tableBody = document.querySelector('.tableBody');

            if (error) {
                console.error(error);
            } 
            
            else {
                data.forEach((user, index) => {
                    const row = document.createElement('tr');

                    /* Formel for å beregne level */
                    const level = (Math.floor((user.total_xp / 100) ** (1/1.6)))+1

                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${user.navn}</td>
                        <td>${(user.total_xp).toFixed(0)}</td>
                        <td>${level}</td>
                    `;
                    tableBody.appendChild(row);

                    if (user.navn === localStorage.getItem("navn")) {
                        row.classList.add('current_user');
                        row.style.backgroundColor = 'var(--secondary_color)';
                    }
                });

                /* --- Søkefunksjonalitet --- */
                const søksfelt = document.getElementById('søksfelt');
                søksfelt.addEventListener('input', () => {
                    const searchTerm = søksfelt.value.toLowerCase();
                    const rows = document.querySelectorAll('tbody tr');
                    rows.forEach(row => {
                        const navn = row.querySelector('td:nth-child(2)').textContent.toLowerCase();
                        if (navn.includes(searchTerm)) {
                            row.style.display = 'table-row';
                        } else {
                            row.style.display = 'none';
                        }
                    });
                });
            }

            // Loading Screen
            setTimeout(() => {
                document.getElementById("loader")?.classList.add("hidden");
            }, 400);
            
        };
        updateLeaderboard();
    </script>

    <script src="navigator.js" defer></script>
    <script type="module" src="../progress.js"></script>
</body>
</html>
